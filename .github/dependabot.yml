version: 2
updates:
  # Root workspace dependencies
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 10
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "automated"
    commit-message:
      prefix: "chore"
      include: "scope"
    groups:
      # Group patch updates together
      patch-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      # Group dev dependencies
      dev-dependencies:
        dependency-type: "development"
        update-types:
          - "minor"
          - "patch"

  # Web app (Next.js)
  - package-ecosystem: "npm"
    directory: "/apps/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "web"
    commit-message:
      prefix: "chore(web)"
    groups:
      nextjs:
        patterns:
          - "next"
          - "@next/*"
          - "react"
          - "react-dom"
      cloudflare:
        patterns:
          - "@cloudflare/*"
          - "@opennextjs/cloudflare"

  # API Videos (Hono)
  - package-ecosystem: "npm"
    directory: "/apps/api-videos"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "api"
    commit-message:
      prefix: "chore(api)"
    groups:
      hono:
        patterns:
          - "hono"
          - "chanfana"

  # Processor
  - package-ecosystem: "npm"
    directory: "/apps/processor"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "processor"
    commit-message:
      prefix: "chore(processor)"

  # WebSocket Server
  - package-ecosystem: "npm"
    directory: "/apps/websocket-server"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 5
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "websocket"
    commit-message:
      prefix: "chore(websocket)"

  # Shared Types
  - package-ecosystem: "npm"
    directory: "/packages/shared-types"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "shared-types"
    commit-message:
      prefix: "chore(types)"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
    open-pull-requests-limit: 3
    reviewers:
      - "meywd"
    labels:
      - "dependencies"
      - "ci/cd"
    commit-message:
      prefix: "chore(ci)"
