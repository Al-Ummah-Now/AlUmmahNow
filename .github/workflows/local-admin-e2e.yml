name: Local admin E2E

# The admin suite (apps/admin-web/e2e, every spec placed `local` in apps/web/e2e/test-utils/placement.ts)
# on the local stack (docs/testing/LOCAL-STACK.md): this PR's code, the Auth repo's last released
# bundle, fakes for Bunny/images/Resend, nothing deployed. Each job boots its own stack; every account
# the suite signs in with (admin, moderator, super admin, viewer) is registered by the job and given its
# role in the stack's database (global-setup.ts); specs create and delete the data they use, and the
# global teardown erases the job's accounts (support/cleanup.ts).
#
# It replaces the admin suite's QA runs (admin-e2e.yml now runs only by hand). It folds into
# local-e2e.yml once that workflow is on main, and gets the end-of-job leftover check with it (#993).
#
# Pull requests only: the jobs fetch another repo's bundle, and in a default-branch context a later
# step could poison caches the default branch trusts (CodeQL actions/cache-poisoning).
on:
  pull_request:
    branches: [main]
    paths:
      - 'apps/admin-web/**'
      - 'apps/admin-api/**'
      - 'apps/api-videos/**'
      - 'apps/websocket-server/**'
      - 'apps/processor/**'
      - 'packages/shared-types/**'
      - 'scripts/local-stack/**'
      - 'apps/web/e2e/test-utils/**'
      - '.github/workflows/local-admin-e2e.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: local-admin-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build local stack (admin)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      # No dependency cache (CodeQL actions/cache-poisoning)
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
          pnpm --filter @al-ummah/web build
          (cd apps/web && pnpm opennextjs-cloudflare build)
          pnpm --filter @al-ummah/admin-web build
          (cd apps/admin-web && pnpm opennextjs-cloudflare build)

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: local-admin-build
          path: |
            packages/*/dist
            apps/web/.open-next
            apps/admin-web/.open-next
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

  admin:
    name: Local admin suite - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LOCAL_STACK_AUTH_DIR: ${{ github.workspace }}/.local-stack/repos/auth
      # Run mode: every account is e2e+<run>-…, every name the suite gives carries the run id
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/2, project: chromium, shard: 1/2, browsers: chromium }
          - { name: chromium 2/2, project: chromium, shard: 2/2, browsers: chromium }
          # Quarantined on the stack (#1020): every test is fixme for WebKit + E2E_ENV=local
          - { name: webkit, project: webkit, shard: 1/1, browsers: chromium webkit }
          - { name: mobile, project: mobile, shard: 1/1, browsers: chromium }
          - { name: shared-state, project: shared-state, shard: 1/1, browsers: chromium }
    steps:
      - uses: actions/checkout@v4

      - name: The Auth repo's last released bundle
        run: node --experimental-strip-types --no-warnings scripts/local-stack/fetch-auth.ts
        env:
          GH_TOKEN: ${{ github.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore builds
        uses: actions/download-artifact@v4
        with:
          name: local-admin-build
          path: .

      - name: Boot
        run: |
          nohup node --experimental-strip-types --no-warnings scripts/local-stack/boot.ts > "$RUNNER_TEMP/stack.log" 2>&1 &
          echo "STACK_PID=$!" >> "$GITHUB_ENV"
          for _ in $(seq 1 180); do
            if [ -f .local-stack/stack.json ]; then exit 0; fi
            if ! kill -0 $! 2>/dev/null; then echo "::error::the stack exited during boot"; cat "$RUNNER_TEMP/stack.log"; exit 1; fi
            sleep 2
          done
          echo "::error::the stack was not ready after 6 minutes"; tail -100 "$RUNNER_TEMP/stack.log"; exit 1

      - name: Smoke
        run: node --experimental-strip-types --no-warnings scripts/local-stack/smoke.ts

      # The translation store, as QA and stage get it at deploy (the stack's buckets start empty)
      - name: Seed translations
        run: pnpm exec tsx scripts/release/seed-translations.ts --env local

      # Global setup always signs in with Chromium; WebKit only for its project
      - uses: ./.github/actions/playwright-install
        with:
          browsers: ${{ matrix.browsers }}
          working-directory: apps/admin-web

      - name: Run
        working-directory: apps/admin-web
        run: |
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USERS_FILE="$RUNNER_TEMP/run-users.txt"
          echo "E2E_RUN_USER_IDS_FILE=$RUNNER_TEMP/run-user-ids.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USER_IDS_FILE="$RUNNER_TEMP/run-user-ids.txt"
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          E2E_RUN_USER_PASSWORD="Adm-$(openssl rand -base64 18 | tr '+/' '-_' | tr -d '=')-1!"
          echo "::add-mask::$E2E_RUN_USER_PASSWORD"
          export E2E_RUN_USER_PASSWORD
          pnpm exec playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          CI: 'true'
          E2E_ENV: local
          E2E_ADMIN_PROJECT: ${{ matrix.project }}
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret
          INTERNAL_API_KEY: local-stack-internal-key

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-admin-${{ strategy.job-index }}
          path: |
            apps/admin-web/playwright-report
            apps/admin-web/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore
