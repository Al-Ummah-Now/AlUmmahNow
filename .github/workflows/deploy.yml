      - name: Deploy Processor Preview to Cloudflare Workers
        run: |
          cd apps/processor
          pnpm wrangler deploy --env development \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with processor preview info
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewName = '${{ steps.preview-name.outputs.name }}';

            const body = `## 🚀 Processor Preview Deployment

            Your queue processor preview deployment is ready!

            **Worker Name**: ${previewName}
            **Environment**: development

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Processor Preview Deployment')
