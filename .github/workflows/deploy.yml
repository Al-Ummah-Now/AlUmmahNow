  # Cleanup previews when PR is closed
  deploy-qa:
    needs: [test, release-checks, build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      # Queues and buckets new bindings need (scripts/release/ensure-resources.ts), then the web
      # apps' browser source maps: uploaded to the private bucket and removed from the assets
      # (scripts/release/upload-sourcemaps.ts; the Errors page symbolicates with them)
      - name: Ensure qa resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/ensure-resources.ts --env qa

      - name: Upload private source maps (qa)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env qa --app web --release "${GITHUB_SHA::12}"
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env qa --app admin-web --release "${GITHUB_SHA::12}"

      - name: Deploy Web to QA
        run: |
          cd apps/web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-web-qa --dir .)
          pnpm wrangler deploy --config wrangler.qa.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to QA
        run: |
          cd apps/api-videos
          pnpm wrangler d1 migrations apply al-ummah-now-search-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Translation store (global_settings R2, #982): repo text wins for every
      # key not on a file's overrides list (admin edits are kept), removed keys
      # are dropped, missing files are seeded. Summary: "translations: N updated, M kept".
      - name: Sync QA translations with the repo
        run: pnpm exec tsx scripts/release/sync-translations.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Smoke: fails when a non-override key differs from the repo, or the API does not serve both locales
      - name: Check QA translations match the repo
        run: pnpm exec tsx scripts/release/sync-translations.ts --env qa --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Processor to QA
        run: |
          cd apps/processor
          pnpm wrangler d1 migrations apply al-ummah-now-notifications-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to QA
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Platform analytics collector (docs/admin/LIVE_OPS.md): its D1 is migrated before
      # admin-api, which reads it (COSTS_DB)
      - name: Deploy Cost Monitor to QA
        run: |
          cd apps/cost-monitor
          pnpm wrangler d1 migrations apply al-ummah-now-costs-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Public status page (docs/status-page/README.md): its D1 is migrated before admin-api,
      # which writes incidents to it (STATUS_DB); then a read-only smoke of status.qa
      - name: Deploy Status Page to QA
        run: |
          cd apps/status
          pnpm wrangler d1 migrations apply al-ummah-now-status-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
          node --experimental-strip-types --no-warnings ../../scripts/release/status-smoke.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to QA
        run: |
          cd apps/admin-api
          pnpm wrangler d1 migrations apply al-ummah-now-reports-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to QA
        run: |
          cd apps/admin-web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-admin-web-qa --dir .)
          pnpm wrangler deploy --config wrangler.qa.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to QA
        run: |
          cd apps/scheduler
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Short share links (apps/short-links, wiki AUN-SHORT-LINKS): qa.alummahnow.link, a Workers
      # Custom Domain (the deploy keeps its DNS record and certificate), then its smoke
      - name: Deploy Short Links to QA
        run: |
          cd apps/short-links
          pnpm wrangler deploy --config wrangler.qa.jsonc
          cd ../..
          node --experimental-strip-types --no-warnings scripts/release/short-links-smoke.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once every new worker writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (qa)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env qa
          pnpm release:content-columns --env qa --check

      - name: Notify QA deployment success
        if: success()
        run: |
          echo "🧪 QA deployment successful!"
          echo ""
          echo "QA Workers deployed:"
          echo "  • al-ummah-web-qa → videos.qa.alummahnow.net"
          echo "  • videos-qa → videos.api.qa.alummahnow.net"
          echo "  • al-ummah-now-processor-qa"
          echo "  • al-ummah-now-comms-qa → realtime.qa.alummahnow.net"
          echo "  • al-ummah-admin-api-qa → admin.api.qa.alummahnow.net"
          echo "  • al-ummah-scheduler-qa (cron)"
          echo "  • al-ummah-admin-web-qa → admin.qa.alummahnow.net"
          echo "  • al-ummah-cost-monitor-qa (cron)"
          echo "  • al-ummah-now-short-links-qa → qa.alummahnow.link"
          echo "  • al-ummah-status-qa → status.qa.alummahnow.net"
          echo ""
          echo "All 10 QA workers are live!"

  # R2 video delivery beside Bunny (epic #687): the media Worker and its FFmpeg
  # container (wrangler builds the image with Docker and pushes it to Cloudflare's
  # registry). Its own job, so a container build problem never blocks the other
  # QA deploys; it runs after them because it binds videos-qa and the queues
  # that "Ensure qa resources" creates.
  deploy-qa-media:
    needs: [deploy-qa]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: qa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      # The CI token needs Containers permission (Account → Containers: Edit) to deploy this
      # Worker; until the owner adds it, skip with a notice instead of failing main. The media
      # Worker is then deployed with an account login (docs/media-delivery/RUNBOOK.md).
      - name: Check the token can deploy Containers
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications")
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Media deploy skipped::CLOUDFLARE_API_TOKEN cannot use the Containers API (HTTP $code). Add Account → Containers: Edit to the token to deploy al-ummah-now-media-qa from CI."
          fi

      - name: Install dependencies
        if: steps.access.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        if: steps.access.outputs.ok == 'true'
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Deploy Media (transcoder + private edge) to QA
        if: steps.access.outputs.ok == 'true'
        run: |
          cd apps/media
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploy to Production (main branch only)
  deploy-production:
    needs: [build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    # Manual only until the release workflow (docs/release-pipeline/PLAN.md, phase 7)
    # replaces this job. Since Jan 2026 the validate jobs failed on main, so this job
    # never ran on push and production has been deployed by hand; now that they pass,
    # a merge must not suddenly deploy all six apps from main (#208: processor's
    # REPORTS_DB is still a placeholder).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
