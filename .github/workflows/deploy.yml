name: Deploy Al Ummah Now Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type checking (all packages)
        run: pnpm type-check
        timeout-minutes: 5

      - name: Run linting (all packages)
        run: pnpm lint
        timeout-minutes: 3

      - name: Run tests (all packages)
        run: pnpm test
        timeout-minutes: 10

  # Release gates (docs/deployment-guide.md, "Release gates"). Plain Node scripts
  # with no dependencies, so no install step.
  release-checks:
    name: Release checks (config, migrations, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Release script tests
        run: pnpm test:scripts

      - name: Fanous tokens (generators, snapshots, WCAG AA contrast)
        run: |
          pnpm test:tokens
          pnpm check:tokens
          pnpm check:theme-colors

      - name: Theme packages (schema, validator, compiler, parity with the pre-package CSS)
        run: |
          pnpm test:themes
          pnpm themes:check

      - name: Wrangler config check
        run: pnpm check:config

      - name: Migrations are append-only
        run: pnpm check:migrations "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: D1 schema snapshots are current
        run: pnpm check:schema

  # Build shared packages first (dependency for other apps)
  build-shared-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages (types + logger)
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

  # Build Web App
  build-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Build shared types
        run: pnpm --filter @al-ummah/shared-types build
        timeout-minutes: 2

      - name: Build web application
        run: |
          # Skew protection + stable Server Action ids (docs/release-pipeline/SKEW-PROTECTION.md):
          # one deployment id per build, and the same action key for every QA build
          # (Next salts action ids with it; a new key per build renamed every action).
          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA is not set: every deploy would rename every Server Action"
            exit 1
          fi
          pnpm --filter @al-ummah/web build
          cd apps/web && pnpm opennextjs-cloudflare build
        env:
          # PR builds never get the key (a random one per build is fine there)
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA || '' }}
        timeout-minutes: 120

      - name: Debug - Check .open-next contents
        run: |
          echo "=== Checking if .open-next exists ==="
          ls -la apps/web/.open-next || echo ".open-next directory not found"
          echo "=== Contents of .open-next ==="
          find apps/web/.open-next -type f || echo "No files found"

      - name: Prepare web artifacts (workaround for .gitignore)
        run: |
          mkdir -p /tmp/web-artifacts
          cp -r apps/web/.open-next /tmp/web-artifacts/
          cp apps/web/package.json /tmp/web-artifacts/
          cp apps/web/wrangler*.jsonc /tmp/web-artifacts/

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: /tmp/web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Validate API Videos
  validate-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check API
        run: pnpm --filter @al-ummah/api-videos type-check
        timeout-minutes: 3

      - name: API unit tests
        run: pnpm --filter @al-ummah/api-videos test:unit
        timeout-minutes: 3

      - name: Validate API deployment
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Processor
  validate-processor:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check processor
        run: pnpm --filter @al-ummah/processor type-check
        timeout-minutes: 3

      - name: Run processor tests
        run: pnpm --filter @al-ummah/processor test
        continue-on-error: true
        timeout-minutes: 3

  # Validate WebSocket Server
  validate-websocket:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check websocket-server
        run: pnpm --filter @al-ummah/websocket-server type-check
        timeout-minutes: 3

      - name: websocket-server unit tests
        run: pnpm --filter @al-ummah/websocket-server test
        timeout-minutes: 3

      - name: Validate websocket-server deployment
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Admin API
  validate-admin-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check Admin API
        run: pnpm --filter @al-ummah/admin-api type-check
        timeout-minutes: 3

      - name: Validate Admin API deployment
        run: |
          cd apps/admin-api
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Build Admin Web App
  build-admin-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Build admin-web application
        run: |
          # Skew protection + stable Server Action ids (docs/release-pipeline/SKEW-PROTECTION.md):
          # one deployment id per build, and the same action key for every QA build
          # (Next salts action ids with it; a new key per build renamed every action).
          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA is not set: every deploy would rename every Server Action"
            exit 1
          fi
          pnpm --filter @al-ummah/admin-web build
          cd apps/admin-web && pnpm opennextjs-cloudflare build
        env:
          # PR builds never get the key (a random one per build is fine there)
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA || '' }}
        timeout-minutes: 30

      - name: Prepare admin-web artifacts
        run: |
          mkdir -p /tmp/admin-web-artifacts
          cp -r apps/admin-web/.open-next /tmp/admin-web-artifacts/
          cp apps/admin-web/package.json /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.jsonc /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.production.jsonc /tmp/admin-web-artifacts/

      - name: Upload admin-web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-build-artifacts
          path: /tmp/admin-web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Deploy Web App Preview (PRs only, when requested via label)
  deploy-web-preview:
    needs: build-web
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Debug - List artifact contents
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== apps/web directory ==="
          ls -la apps/web/ || echo "apps/web directory not found"
          echo "=== Looking for .open-next ==="
          find . -name ".open-next" -type d
          echo "=== Looking for worker.js ==="
          find . -name "worker.js"

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-web-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT

      - name: Deploy Web Preview to Cloudflare Workers
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.preview.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 Web App Preview Deployment

            Your web app preview deployment is ready!

            **Preview URL**: ${previewUrl}

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Web App Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy API Videos Preview (PRs only, when requested via label)
  deploy-api-preview:
    needs: validate-api
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-api-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT

      - name: Deploy API Preview to Cloudflare Workers
        run: |
          cd apps/api-videos
          # QA config: the top-level config is production (custom domain + prod data);
          # deploying it under another --name moves the prod domain to the preview
          pnpm wrangler deploy --config wrangler.qa.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with API preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 API Preview Deployment

            Your API preview deployment is ready!

            **API URL**: ${previewUrl}
            **Swagger UI**: ${previewUrl}/
            **OpenAPI Spec**: ${previewUrl}/openapi.json

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('API Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy Processor Preview (PRs only, when requested via label)
  deploy-processor-preview:
    needs: validate-processor
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-processor-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT

      - name: Deploy Processor Preview to Cloudflare Workers
        run: |
          cd apps/processor
          pnpm wrangler deploy --env development \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with processor preview info
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewName = '${{ steps.preview-name.outputs.name }}';

            const body = `## 🚀 Processor Preview Deployment

            Your queue processor preview deployment is ready!

            **Worker Name**: ${previewName}
            **Environment**: development

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Processor Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy WebSocket Server Preview (PRs only, when requested via label)
  deploy-websocket-preview:
    needs: validate-websocket
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-comms-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT

      - name: Deploy WebSocket Preview to Cloudflare Workers
        run: |
          cd apps/websocket-server
          # QA config: the top-level config is production (custom domain + prod data);
          # deploying it under another --name moves the prod domain to the preview
          pnpm wrangler deploy --config wrangler.qa.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with websocket preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 WebSocket Server Preview Deployment

            Your WebSocket server preview deployment is ready!

            **WebSocket URL**: ${previewUrl}/ws
            **Health Check**: ${previewUrl}/health
            **Stats**: ${previewUrl}/stats

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
