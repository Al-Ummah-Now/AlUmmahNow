        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      - name: Deploy Web to Production
        run: |
          cd apps/web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-now-production --dir .)
          pnpm wrangler deploy --config wrangler.production.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Production
        run: |
          cd apps/api-videos
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once the new api-videos writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
