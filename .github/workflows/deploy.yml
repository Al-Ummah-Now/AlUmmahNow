name: Deploy Al Ummah Now

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run type checking
        run: npx tsc --noEmit
      
      - name: Run linting
        run: npm run lint
      
      - name: Security audit
        run: npm audit --audit-level moderate
        continue-on-error: true

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Build application
        run: npm run build
        timeout-minutes: 120
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            .open-next/
            package.json
            package-lock.json
            wrangler.jsonc
          retention-days: 30

  deploy-preview:
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    environment: preview
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      
      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-now-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT
      
      - name: Deploy Preview to Cloudflare Workers
        run: |
          npx wrangler deploy --config wrangler.preview.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Comment PR with preview link
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';
            
            const body = `## 🚀 Preview Deployment
            
            Your preview deployment is ready!
            
            **Preview URL**: ${previewUrl}
            
            This preview will be automatically cleaned up when the PR is closed.
            
            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;
            
            // Check if we already commented
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });
            
            const existingComment = comments.data.find(comment => 
              comment.user.login === 'github-actions[bot]' && 
              comment.body.includes('Preview Deployment')
            );
            
            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  cleanup-preview:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-now-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
      
      - name: Delete preview deployment
        run: |
          npx wrangler delete ${{ steps.preview-name.outputs.name }} || echo "Preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

  deploy-staging:
    needs: build
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: staging
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      
      - name: Deploy to Cloudflare Workers (Staging)
        run: npx wrangler deploy --config wrangler.staging.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Notify deployment status
        if: always()
        run: |
          echo "Staging deployment completed with status: ${{ job.status }}"

  deploy-production:
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
      
      - name: Deploy to Cloudflare Workers (Production)
        run: npx wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      
      - name: Notify deployment success
        if: success()
        run: |
          echo "Production deployment successful! 🚀"
          echo "Application deployed to Cloudflare Workers with Bunny.net integration"
      
      - name: Notify deployment failure
        if: failure()
        run: |
          echo "Production deployment failed ❌"
          echo "Please check logs and consider rolling back if necessary"