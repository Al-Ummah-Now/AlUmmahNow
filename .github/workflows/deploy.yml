          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-admin-web --dir .)
          pnpm wrangler deploy --config wrangler.production.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to Production
        run: |
