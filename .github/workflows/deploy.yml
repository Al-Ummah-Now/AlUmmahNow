          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with API preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 API Preview Deployment

            Your API preview deployment is ready!

            **API URL**: ${previewUrl}
            **Swagger UI**: ${previewUrl}/
            **OpenAPI Spec**: ${previewUrl}/openapi.json

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('API Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy Processor Preview (PRs only, when requested via label)
  deploy-processor-preview:
