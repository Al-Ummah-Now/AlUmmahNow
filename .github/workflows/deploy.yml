name: Deploy Al Ummah Now Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type checking (all packages)
        run: pnpm type-check
        timeout-minutes: 5

      - name: Run linting (all packages)
        run: pnpm lint
        timeout-minutes: 3

      # apps/media measures the colours of what the ladder really makes (test/colour-ffmpeg.test.ts)
      - name: Install ffmpeg for the media tests
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg
          no-install-recommends: 'true'

      # Two packages at a time (turbo.json sets "concurrency": "12", so every package's test ran at once):
      # web's jest, admin-web's, the API's and the rest together on four vCPUs made a 0.4 s test file take
      # 20 s here and tests that need 50 ms hit jest's 5 s (#2016, #1993; LiveChat.test.tsx 20 to 22 s in
      # passing runs). Measured on this job: 12 at once 144 to 257 s, 2 at once 167 s, 1 at a time 261 s
      - name: Run tests (all packages)
        run: pnpm exec turbo run test --concurrency=2
        timeout-minutes: 10

      # The same colour test with the ffmpeg production runs: in the container image itself
      - name: Colours in the transcoder image
        run: |
          docker build -q -t media-container apps/media/container
          docker run --rm -e CI=1 -v "$PWD/apps/media:/m:ro" -w /m --entrypoint node media-container --test test/colour-ffmpeg.test.ts test/ladder.test.ts
        timeout-minutes: 8

  # Release gates (docs/deployment-guide.md, "Release gates"). Plain Node scripts
  # with no dependencies, so no install step.
  release-checks:
    name: Release checks (config, migrations, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Release script tests
        run: pnpm test:scripts

      - name: Fanous tokens (generators, snapshots, WCAG AA contrast)
        run: |
          pnpm test:tokens
          pnpm check:tokens
          pnpm check:theme-colors

      - name: Theme packages (schema, validator, compiler, parity with the pre-package CSS)
        run: |
          pnpm test:themes
          pnpm themes:check

      - name: Numbers and dates go through locale-format (Arabic ٠–٩)
        run: pnpm check:locale-format

      - name: API errors go through apiError (the error envelope's catalogue)
        run: pnpm check:error-bodies

      - name: Wrangler config check
        run: pnpm check:config

      - name: Migrations are append-only
        env:
          MIGRATION_BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          # A manual redeploy has no push range. Check the commit against its first parent.
          if [[ "$GITHUB_EVENT_NAME" == workflow_dispatch ]]; then
            MIGRATION_BASE=HEAD^
          fi
          pnpm check:migrations "$MIGRATION_BASE"

      - name: D1 schema snapshots are current
        run: pnpm check:schema

  # Build shared packages first (dependency for other apps)
  build-shared-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages (types + logger)
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

  # Build Web App
  build-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Build shared types
        run: pnpm --filter @al-ummah/shared-types build
        timeout-minutes: 2

      - name: Build web application
        run: |
          # Skew protection + stable Server Action ids (docs/release-pipeline/SKEW-PROTECTION.md):
          # one deployment id per build, and the same action key for every QA build
          # (Next salts action ids with it; a new key per build renamed every action).
          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA is not set: every deploy would rename every Server Action"
            exit 1
          fi
          pnpm --filter @al-ummah/web build
          cd apps/web && pnpm opennextjs-cloudflare build
        env:
          # PR builds never get the key (a random one per build is fine there)
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA || '' }}
        timeout-minutes: 120

      - name: Debug - Check .open-next contents
        run: |
          echo "=== Checking if .open-next exists ==="
          ls -la apps/web/.open-next || echo ".open-next directory not found"
          echo "=== Contents of .open-next ==="
          find apps/web/.open-next -type f || echo "No files found"

      - name: Prepare web artifacts (workaround for .gitignore)
        run: |
          mkdir -p /tmp/web-artifacts
          cp -r apps/web/.open-next /tmp/web-artifacts/
          cp apps/web/package.json /tmp/web-artifacts/
          cp apps/web/wrangler*.jsonc /tmp/web-artifacts/

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: /tmp/web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Validate API Videos
  validate-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check API
        run: pnpm --filter @al-ummah/api-videos type-check
        timeout-minutes: 3

      - name: API unit tests
        run: pnpm --filter @al-ummah/api-videos test:unit
        # The suite passes in ~180 s and grows with every feature; 3 min killed green runs (main 2026-11-23)
        timeout-minutes: 6

      - name: Validate API deployment
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Processor
  validate-processor:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check processor
        run: pnpm --filter @al-ummah/processor type-check
        timeout-minutes: 3

      - name: Run processor tests
        run: pnpm --filter @al-ummah/processor test
        continue-on-error: true
        timeout-minutes: 3

  # Validate WebSocket Server
  validate-websocket:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check websocket-server
        run: pnpm --filter @al-ummah/websocket-server type-check
        timeout-minutes: 3

      - name: websocket-server unit tests
        run: pnpm --filter @al-ummah/websocket-server test
        timeout-minutes: 3

      - name: Validate websocket-server deployment
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Admin API
  validate-admin-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Type check Admin API
        run: pnpm --filter @al-ummah/admin-api type-check
        timeout-minutes: 3

      - name: Validate Admin API deployment
        run: |
          cd apps/admin-api
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Build Admin Web App
  build-admin-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Build admin-web application
        run: |
          # Skew protection + stable Server Action ids (docs/release-pipeline/SKEW-PROTECTION.md):
          # one deployment id per build, and the same action key for every QA build
          # (Next salts action ids with it; a new key per build renamed every action).
          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ] && [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA is not set: every deploy would rename every Server Action"
            exit 1
          fi
          pnpm --filter @al-ummah/admin-web build
          cd apps/admin-web && pnpm opennextjs-cloudflare build
        env:
          # PR builds never get the key (a random one per build is fine there)
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ github.event_name != 'pull_request' && secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY_QA || '' }}
        timeout-minutes: 30

      - name: Prepare admin-web artifacts
        run: |
          mkdir -p /tmp/admin-web-artifacts
          cp -r apps/admin-web/.open-next /tmp/admin-web-artifacts/
          cp apps/admin-web/package.json /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.jsonc /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.production.jsonc /tmp/admin-web-artifacts/

      - name: Upload admin-web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-build-artifacts
          path: /tmp/admin-web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Deploy Web App Preview (PRs only, when requested via label)
  deploy-web-preview:
    needs: build-web
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        # The worker bundle imports them from their dist/ (not in the web build artifact)
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Debug - List artifact contents
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== apps/web directory ==="
          ls -la apps/web/ || echo "apps/web directory not found"
          echo "=== Looking for .open-next ==="
          find . -name ".open-next" -type d
          echo "=== Looking for worker.js ==="
          find . -name "worker.js"

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-web-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT

      - name: Deploy Web Preview to Cloudflare Workers
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.preview.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 Web App Preview Deployment

            Your web app preview deployment is ready!

            **Preview URL**: ${previewUrl}

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Web App Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy QA (every push to main)
  deploy-qa:
    needs: [test, release-checks, build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    concurrency:
      group: deploy-qa
      cancel-in-progress: false
    environment: qa
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - uses: actions/checkout@v4

      - name: Still the head of main?
        id: head
        run: bash scripts/release/check-qa-head.sh

      - name: Setup pnpm
        if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        if: steps.head.outputs.current == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        if: steps.head.outputs.current == 'true'
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Download web build artifacts
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        if: steps.head.outputs.current == 'true'
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      # Queues and buckets new bindings need (scripts/release/ensure-resources.ts), then the web
      # apps' browser source maps: uploaded to the private bucket and removed from the assets
      # (scripts/release/upload-sourcemaps.ts; the Errors page symbolicates with them)
      - name: Ensure qa resources
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/ensure-resources.ts --env qa

      - name: Upload private source maps (qa)
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env qa --app web --release "${GITHUB_SHA::12}"
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env qa --app admin-web --release "${GITHUB_SHA::12}"

      - name: Deploy Web to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-web-qa --dir .)
          pnpm wrangler deploy --config wrangler.qa.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/api-videos
          pnpm wrangler d1 migrations apply al-ummah-now-search-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Translation store (global_settings R2, #982): repo text wins for every
      # key not on a file's overrides list (admin edits are kept), removed keys
      # are dropped, missing files are seeded. Summary: "translations: N updated, M kept".
      - name: Sync QA translations with the repo
        if: steps.head.outputs.current == 'true'
        run: pnpm exec tsx scripts/release/sync-translations.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Smoke: fails when a non-override key differs from the repo, or the API does not serve both locales
      - name: Check QA translations match the repo
        if: steps.head.outputs.current == 'true'
        run: pnpm exec tsx scripts/release/sync-translations.ts --env qa --check
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Processor to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/processor
          pnpm wrangler d1 migrations apply al-ummah-now-notifications-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Platform analytics collector (docs/admin/LIVE_OPS.md): its D1 is migrated before
      # admin-api, which reads it (COSTS_DB)
      - name: Deploy Cost Monitor to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/cost-monitor
          pnpm wrangler d1 migrations apply al-ummah-now-costs-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Public status page (docs/status-page/README.md): its D1 is migrated before admin-api,
      # which writes incidents to it (STATUS_DB); then a read-only smoke of status.qa
      - name: Deploy Status Page to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/status
          pnpm wrangler d1 migrations apply al-ummah-now-status-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
          node --experimental-strip-types --no-warnings ../../scripts/release/status-smoke.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/admin-api
          pnpm wrangler d1 migrations apply al-ummah-now-reports-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/admin-web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-admin-web-qa --dir .)
          pnpm wrangler deploy --config wrangler.qa.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/scheduler
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Short share links (apps/short-links, wiki AUN-SHORT-LINKS): qa.alummahnow.link, a Workers
      # Custom Domain (the deploy keeps its DNS record and certificate), then its smoke
      - name: Deploy Short Links to QA
        if: steps.head.outputs.current == 'true'
        run: |
          cd apps/short-links
          pnpm wrangler deploy --config wrangler.qa.jsonc
          cd ../..
          node --experimental-strip-types --no-warnings scripts/release/short-links-smoke.ts --env qa
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once every new worker writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (qa)
        if: steps.head.outputs.current == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env qa
          pnpm release:content-columns --env qa --check

      - name: Notify QA deployment success
        if: steps.head.outputs.current == 'true'
        run: |
          echo "🧪 QA deployment successful!"
          echo ""
          echo "QA Workers deployed:"
          echo "  • al-ummah-web-qa → videos.qa.alummahnow.net"
          echo "  • videos-qa → videos.api.qa.alummahnow.net"
          echo "  • al-ummah-now-processor-qa"
          echo "  • al-ummah-now-comms-qa → realtime.qa.alummahnow.net"
          echo "  • al-ummah-admin-api-qa → admin.api.qa.alummahnow.net"
          echo "  • al-ummah-scheduler-qa (cron)"
          echo "  • al-ummah-admin-web-qa → admin.qa.alummahnow.net"
          echo "  • al-ummah-cost-monitor-qa (cron)"
          echo "  • al-ummah-now-short-links-qa → qa.alummahnow.link"
          echo "  • al-ummah-status-qa → status.qa.alummahnow.net"
          echo ""
          echo "All 10 QA workers are live!"

  # R2 video delivery beside Bunny (epic #687): the media Worker and its FFmpeg
  # container (wrangler builds the image with Docker and pushes it to Cloudflare's
  # registry). Its own job, so a container build problem never blocks the other
  # QA deploys; it runs after them because it binds videos-qa and the queues
  # that "Ensure qa resources" creates.
  deploy-qa-media:
    needs: [deploy-qa]
    runs-on: ubuntu-latest
    if: needs.deploy-qa.outputs.current == 'true'
    concurrency:
      group: deploy-qa-media
      cancel-in-progress: false
    environment: qa
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Still the head of main?
        id: head
        run: bash scripts/release/check-qa-head.sh

      - name: Setup pnpm
        if: steps.head.outputs.current == 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        if: steps.head.outputs.current == 'true'
        with:
          node-version: '22'
          cache: 'pnpm'

      # The CI token needs Containers permission (Account → Containers: Edit) to deploy this
      # Worker; until the owner adds it, skip with a notice instead of failing main. The media
      # Worker is then deployed with an account login (docs/media-delivery/RUNBOOK.md).
      - name: Check the token can deploy Containers
        if: steps.head.outputs.current == 'true'
        id: access
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/containers/applications")
          if [ "$code" = "200" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Media deploy skipped::CLOUDFLARE_API_TOKEN cannot use the Containers API (HTTP $code). Add Account → Containers: Edit to the token to deploy al-ummah-now-media-qa from CI."
          fi

      - name: Install dependencies
        if: steps.head.outputs.current == 'true' && steps.access.outputs.ok == 'true'
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        if: steps.head.outputs.current == 'true' && steps.access.outputs.ok == 'true'
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Deploy Media (transcoder + private edge) to QA
        if: steps.head.outputs.current == 'true' && steps.access.outputs.ok == 'true'
        run: |
          cd apps/media
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  # Deploy to Production (main branch only)
  deploy-production:
    needs: [build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    # Manual only until the release workflow (docs/release-pipeline/PLAN.md, phase 7)
    # replaces this job. Since Jan 2026 the validate jobs failed on main, so this job
    # never ran on push and production has been deployed by hand; now that they pass,
    # a merge must not suddenly deploy all six apps from main (#208: processor's
    # REPORTS_DB is still a placeholder).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      - name: Deploy Web to Production
        run: |
          cd apps/web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-now-production --dir .)
          pnpm wrangler deploy --config wrangler.production.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Production
        run: |
          cd apps/api-videos
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once the new api-videos writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env production
          pnpm release:content-columns --env production --check

      - name: Deploy Processor to Production
        run: |
          cd apps/processor
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to Production
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to Production
        run: |
          cd apps/admin-api
          pnpm wrangler d1 migrations apply al-ummah-now-reports --remote
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to Production
        run: |
          cd apps/admin-web
          # Pages opened on the version serving now keep being served by it (skew protection)
          MAPPING=$(node --experimental-strip-types --no-warnings ../../scripts/release/skew-mapping.ts --worker al-ummah-admin-web --dir .)
          pnpm wrangler deploy --config wrangler.production.jsonc --var "CF_DEPLOYMENT_MAPPING:$MAPPING"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to Production
        run: |
          cd apps/scheduler
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify production deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo ""
          echo "Workers deployed:"
          echo "  • al-ummah-web (Next.js frontend)"
          echo "  • videos (Hono API backend)"
          echo "  • al-ummah-now-processor (Queue consumer)"
          echo "  • al-ummah-now-comms (WebSocket server)"
          echo "  • al-ummah-admin-api (Admin API backend)"
          echo "  • al-ummah-admin-web (Admin Web frontend)"
          echo "  • al-ummah-scheduler (cron)"
          echo ""
          echo "All 7 production workers are live!"

      - name: Notify production deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Please check logs and consider rolling back if necessary"
