name: Deploy Al Ummah Now Monorepo

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type checking (all packages)
        run: pnpm type-check
        timeout-minutes: 5

      - name: Run linting (all packages)
        run: pnpm lint
        timeout-minutes: 3

      - name: Run tests (all packages)
        run: pnpm test
        continue-on-error: true
        timeout-minutes: 5

  # Build shared packages first (dependency for other apps)
  build-shared-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages (types + logger)
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

  # Build Web App
  build-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Build shared types
        run: pnpm --filter @al-ummah/shared-types build
        timeout-minutes: 2

      - name: Build web application
        run: |
          pnpm --filter @al-ummah/web build
          cd apps/web && pnpm opennextjs-cloudflare build
        timeout-minutes: 120

      - name: Debug - Check .open-next contents
        run: |
          echo "=== Checking if .open-next exists ==="
          ls -la apps/web/.open-next || echo ".open-next directory not found"
          echo "=== Contents of .open-next ==="
          find apps/web/.open-next -type f || echo "No files found"

      - name: Prepare web artifacts (workaround for .gitignore)
        run: |
          mkdir -p /tmp/web-artifacts
          cp -r apps/web/.open-next /tmp/web-artifacts/
          cp apps/web/package.json /tmp/web-artifacts/
          cp apps/web/wrangler*.jsonc /tmp/web-artifacts/

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: /tmp/web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Validate API Videos
  validate-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check API
        run: pnpm --filter @al-ummah/api-videos type-check
        continue-on-error: true
        timeout-minutes: 3

      - name: Validate API deployment
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Processor
  validate-processor:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check processor
        run: pnpm --filter @al-ummah/processor type-check
        timeout-minutes: 3

      - name: Run processor tests
        run: pnpm --filter @al-ummah/processor test
        continue-on-error: true
        timeout-minutes: 3

  # Validate WebSocket Server
  validate-websocket:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check websocket-server
        run: pnpm --filter @al-ummah/websocket-server type-check
        timeout-minutes: 3

      - name: Validate websocket-server deployment
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Admin API
  validate-admin-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check Admin API
        run: pnpm --filter @al-ummah/admin-api type-check
        timeout-minutes: 3

      - name: Validate Admin API deployment
        run: |
          cd apps/admin-api
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Build Admin Web App
  build-admin-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Build admin-web application
        run: |
          pnpm --filter @al-ummah/admin-web build
          cd apps/admin-web && pnpm opennextjs-cloudflare build
        timeout-minutes: 30

      - name: Prepare admin-web artifacts
        run: |
          mkdir -p /tmp/admin-web-artifacts
          cp -r apps/admin-web/.open-next /tmp/admin-web-artifacts/
          cp apps/admin-web/package.json /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.jsonc /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.production.jsonc /tmp/admin-web-artifacts/

      - name: Upload admin-web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-build-artifacts
          path: /tmp/admin-web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Deploy Web App Preview (PRs only, when requested via label)
  deploy-web-preview:
    needs: build-web
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Debug - List artifact contents
        run: |
          echo "=== Repository root ==="
          ls -la
          echo "=== apps/web directory ==="
          ls -la apps/web/ || echo "apps/web directory not found"
          echo "=== Looking for .open-next ==="
          find . -name ".open-next" -type d
          echo "=== Looking for worker.js ==="
          find . -name "worker.js"

      - name: Generate preview name
        id: preview-name
        run: |
          PREVIEW_NAME="al-ummah-web-pr-${{ github.event.number }}"
          echo "name=$PREVIEW_NAME" >> $GITHUB_OUTPUT
          echo "url=https://$PREVIEW_NAME.workers.dev" >> $GITHUB_OUTPUT

      - name: Deploy Web Preview to Cloudflare Workers
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.preview.jsonc \
            --name ${{ steps.preview-name.outputs.name }} \
            --compatibility-date $(date +%Y-%m-%d)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment PR with preview link
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo, number } = context.issue;
            const previewUrl = '${{ steps.preview-name.outputs.url }}';

            const body = `## 🚀 Web App Preview Deployment

            Your web app preview deployment is ready!

            **Preview URL**: ${previewUrl}

            This preview will be automatically cleaned up when the PR is closed.

            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Web App Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Deploy API Videos Preview (PRs only, when requested via label)
  deploy-api-preview:
    needs: validate-api
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
