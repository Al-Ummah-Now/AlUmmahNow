name: Deploy Al Ummah Now Monorepo

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  packages: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        timeout-minutes: 5
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run type checking (all packages)
        run: pnpm type-check
        timeout-minutes: 5

      - name: Run linting (all packages)
        run: pnpm lint
        timeout-minutes: 3

      - name: Run tests (all packages)
        run: pnpm test
        timeout-minutes: 10

  # Release gates (docs/deployment-guide.md, "Release gates"). Plain Node scripts
  # with no dependencies, so no install step.
  release-checks:
    name: Release checks (config, migrations, schema)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Release script tests
        run: pnpm test:scripts

      - name: Fanous tokens (generators, snapshots, WCAG AA contrast)
        run: |
          pnpm test:tokens
          pnpm check:tokens

      - name: Wrangler config check
        run: pnpm check:config

      - name: Migrations are append-only
        run: pnpm check:migrations "${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}"

      - name: D1 schema snapshots are current
        run: pnpm check:schema

  # Build shared packages first (dependency for other apps)
  build-shared-packages:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages (types + logger)
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

  # Build Web App
  build-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Build shared types
        run: pnpm --filter @al-ummah/shared-types build
        timeout-minutes: 2

      - name: Build web application
        run: |
          pnpm --filter @al-ummah/web build
          cd apps/web && pnpm opennextjs-cloudflare build
        timeout-minutes: 120

      - name: Debug - Check .open-next contents
        run: |
          echo "=== Checking if .open-next exists ==="
          ls -la apps/web/.open-next || echo ".open-next directory not found"
          echo "=== Contents of .open-next ==="
          find apps/web/.open-next -type f || echo "No files found"

      - name: Prepare web artifacts (workaround for .gitignore)
        run: |
          mkdir -p /tmp/web-artifacts
          cp -r apps/web/.open-next /tmp/web-artifacts/
          cp apps/web/package.json /tmp/web-artifacts/
          cp apps/web/wrangler*.jsonc /tmp/web-artifacts/

      - name: Upload web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: web-build-artifacts
          path: /tmp/web-artifacts
          retention-days: 30
          include-hidden-files: true

  # Validate API Videos
  validate-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check API
        run: pnpm --filter @al-ummah/api-videos type-check
        timeout-minutes: 3

      - name: API unit tests
        run: pnpm --filter @al-ummah/api-videos test:unit
        timeout-minutes: 3

      - name: Validate API deployment
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Processor
  validate-processor:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check processor
        run: pnpm --filter @al-ummah/processor type-check
        timeout-minutes: 3

      - name: Run processor tests
        run: pnpm --filter @al-ummah/processor test
        continue-on-error: true
        timeout-minutes: 3

  # Validate WebSocket Server
  validate-websocket:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check websocket-server
        run: pnpm --filter @al-ummah/websocket-server type-check
        timeout-minutes: 3

      - name: websocket-server unit tests
        run: pnpm --filter @al-ummah/websocket-server test
        timeout-minutes: 3

      - name: Validate websocket-server deployment
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Validate Admin API
  validate-admin-api:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Type check Admin API
        run: pnpm --filter @al-ummah/admin-api type-check
        timeout-minutes: 3

      - name: Validate Admin API deployment
        run: |
          cd apps/admin-api
          pnpm wrangler deploy --dry-run
        timeout-minutes: 2

  # Build Admin Web App
  build-admin-web:
    needs: build-shared-packages
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Build admin-web application
        run: |
          pnpm --filter @al-ummah/admin-web build
          cd apps/admin-web && pnpm opennextjs-cloudflare build
        timeout-minutes: 30

      - name: Prepare admin-web artifacts
        run: |
          mkdir -p /tmp/admin-web-artifacts
          cp -r apps/admin-web/.open-next /tmp/admin-web-artifacts/
          cp apps/admin-web/package.json /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.jsonc /tmp/admin-web-artifacts/
          cp apps/admin-web/wrangler.production.jsonc /tmp/admin-web-artifacts/

      - name: Upload admin-web build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: admin-web-build-artifacts
          path: /tmp/admin-web-artifacts
          retention-days: 30
          include-hidden-files: true

  # A per-PR preview on QA data (issue #486), only when the deploy-preview label
  # is set. Built from the QA configs by scripts/release/preview-config.ts, which
  # refuses anything bound to production. Only web and api-videos are deployed.
  pr-preview:
    needs: [build-web, validate-api]
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs never get preview secrets, so never try to deploy their code.
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository && contains(github.event.pull_request.labels.*.name, 'deploy-preview')
    environment: preview
    concurrency:
      group: pr-preview-${{ github.event.number }}
      cancel-in-progress: true
    outputs:
      web: ${{ steps.config.outputs.web }}
      api: ${{ steps.config.outputs.api }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Find the account's workers.dev subdomain
        id: subdomain
        run: |
          value=$(curl -fsS -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/subdomain" | jq -r .result.subdomain)
          test -n "$value" && test "$value" != null
          echo "value=$value" >> "$GITHUB_OUTPUT"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Generate preview configs (fails on any production binding or host)
        id: config
        run: |
          N=${{ github.event.number }}
          SUB=${{ steps.subdomain.outputs.value }}
          for app in web api-videos; do
            node --experimental-strip-types --no-warnings scripts/release/preview-config.ts \
              --app "$app" --pr "$N" --subdomain "$SUB" --out "apps/$app/wrangler.pr-preview.json"
          done
          echo "web=https://al-ummah-web-pr-$N.$SUB.workers.dev" >> "$GITHUB_OUTPUT"
          echo "api=https://al-ummah-api-pr-$N.$SUB.workers.dev" >> "$GITHUB_OUTPUT"

      # Additive migrations only (check:migrations). Applied through wrangler, so
      # d1_migrations records them and main's later deploy skips them.
      - name: Apply this PR's migrations to QA
        run: |
          (cd apps/api-videos && pnpm wrangler d1 migrations apply al-ummah-now-search-qa --remote --config wrangler.qa.jsonc)
          (cd apps/processor && pnpm wrangler d1 migrations apply al-ummah-now-notifications-qa --remote --config wrangler.qa.jsonc)
          (cd apps/admin-api && pnpm wrangler d1 migrations apply al-ummah-now-reports-qa --remote --config wrangler.qa.jsonc)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: QA still works on main's code with those migrations
        run: pnpm smoke --env qa

      - name: Deploy the API preview
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --config wrangler.pr-preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy the web preview
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.pr-preview.json
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Fill and verify new columns on QA
        run: |
          if [ -f scripts/release/content-columns.ts ]; then
            pnpm release:content-columns --env qa
            pnpm release:content-columns --env qa --check
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Comment the preview URLs
        run: |
          gh pr comment ${{ github.event.number }} --edit-last --create-if-none --body \
            "Preview on QA data. Web: ${{ steps.config.outputs.web }} API: ${{ steps.config.outputs.api }}"
        env:
          GH_TOKEN: ${{ github.token }}

  # The PR's own Studio specs against its own preview, in all three engines.
  pr-preview-e2e:
    needs: pr-preview
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      E2E_ENV: qa
      WEB_APP_URL: ${{ needs.pr-preview.outputs.web }}
      E2E_API_URL: ${{ needs.pr-preview.outputs.api }}
      PLAYWRIGHT_VERSION: 1.56.1  # keep in step with apps/web/package.json
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Prepare the suite
        run: |
          SUITE="$RUNNER_TEMP/preview-e2e"
          mkdir -p "$SUITE/e2e/test-utils"
          cp -R apps/web/e2e/release apps/web/e2e/test-fixtures "$SUITE/e2e/"
          cp apps/web/e2e/test-utils/code-sink.ts "$SUITE/e2e/test-utils/"
          cp apps/web/playwright.release.config.ts "$SUITE/"
          cd "$SUITE"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@playwright/test@$PLAYWRIGHT_VERSION"
          npx playwright install --with-deps chromium firefox webkit
          echo "SUITE=$SUITE" >> "$GITHUB_ENV"

      - name: Run the PR's Studio specs on its preview
        working-directory: ${{ env.SUITE }}
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}
        run: |
          if ! ls e2e/release/studio-*.spec.ts > /dev/null 2>&1; then
            echo "No Studio specs on this branch."
            exit 0
          fi
          npx playwright test -c playwright.release.config.ts studio- --project=auth-flows --project=studio-firefox --project=studio-webkit

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: preview-e2e-report
          path: ${{ env.SUITE }}/test-results
          retention-days: 7

  # Deploy to QA from main (owner rule: fix on main, deploy QA and prod from main).
  # Runs on every push to main and on manual dispatch from main; never from
  # develop, integrate/* or hotfix branches. Prod stays manual (deploy-production).
  deploy-qa:
    needs: [test, release-checks, build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      - name: Deploy Web to QA
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to QA
        run: |
          cd apps/api-videos
          pnpm wrangler d1 migrations apply al-ummah-now-search-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Processor to QA
        run: |
          cd apps/processor
          pnpm wrangler d1 migrations apply al-ummah-now-notifications-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to QA
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to QA
        run: |
          cd apps/admin-api
          pnpm wrangler d1 migrations apply al-ummah-now-reports-qa --remote --config wrangler.qa.jsonc
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to QA
        run: |
          cd apps/admin-web
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to QA
        run: |
          cd apps/scheduler
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once every new worker writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (qa)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env qa
          pnpm release:content-columns --env qa --check

      - name: Notify QA deployment success
        if: success()
        run: |
          echo "🧪 QA deployment successful!"
          echo ""
          echo "QA Workers deployed:"
          echo "  • al-ummah-web-qa → videos.qa.alummahnow.net"
          echo "  • videos-qa → videos.api.qa.alummahnow.net"
          echo "  • al-ummah-now-processor-qa"
          echo "  • al-ummah-now-comms-qa → realtime.qa.alummahnow.net"
          echo "  • al-ummah-admin-api-qa → admin.api.qa.alummahnow.net"
          echo "  • al-ummah-scheduler-qa (cron)"
          echo "  • al-ummah-admin-web-qa → admin.qa.alummahnow.net"
          echo ""
          echo "All 7 QA workers are live!"

  # Deploy to Production (main branch only)
  deploy-production:
    needs: [build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    # Manual only until the release workflow (docs/release-pipeline/PLAN.md, phase 7)
    # replaces this job. Since Jan 2026 the validate jobs failed on main, so this job
    # never ran on push and production has been deployed by hand; now that they pass,
    # a merge must not suddenly deploy all six apps from main (#208: processor's
    # REPORTS_DB is still a placeholder).
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      - name: Deploy Web to Production
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to Production
        run: |
          cd apps/api-videos
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Fills columns added by a migration, once the new api-videos writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env production
          pnpm release:content-columns --env production --check

      - name: Deploy Processor to Production
        run: |
          cd apps/processor
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to Production
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to Production
        run: |
          cd apps/admin-api
          pnpm wrangler d1 migrations apply al-ummah-now-reports --remote
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to Production
        run: |
          cd apps/admin-web
          pnpm wrangler deploy --config wrangler.production.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Scheduler to Production
        run: |
          cd apps/scheduler
          pnpm wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify production deployment success
        if: success()
        run: |
          echo "🚀 Production deployment successful!"
          echo ""
          echo "Workers deployed:"
          echo "  • al-ummah-web (Next.js frontend)"
          echo "  • videos (Hono API backend)"
          echo "  • al-ummah-now-processor (Queue consumer)"
          echo "  • al-ummah-now-comms (WebSocket server)"
          echo "  • al-ummah-admin-api (Admin API backend)"
          echo "  • al-ummah-admin-web (Admin Web frontend)"
          echo "  • al-ummah-scheduler (cron)"
          echo ""
          echo "All 7 production workers are live!"

      - name: Notify production deployment failure
        if: failure()
        run: |
          echo "❌ Production deployment failed!"
          echo "Please check logs and consider rolling back if necessary"
