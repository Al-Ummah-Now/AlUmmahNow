            ---
            <sub>Deployed via Cloudflare Workers Preview</sub>`;

            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number: number,
            });

            const existingComment = comments.data.find(comment =>
              comment.user.login === 'github-actions[bot]' &&
              comment.body.includes('Admin Web Preview Deployment')
            );

            if (existingComment) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: number,
                body
              });
            }

  # Cleanup previews when PR is closed
  cleanup-previews:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate preview names
        id: preview-names
        run: |
          echo "web=al-ummah-web-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "api=al-ummah-api-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "processor=al-ummah-processor-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "websocket=al-ummah-comms-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "admin_api=al-ummah-admin-api-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT
          echo "admin_web=al-ummah-admin-web-pr-${{ github.event.number }}" >> $GITHUB_OUTPUT

      - name: Delete web preview
        continue-on-error: true
        run: |
          cd apps/web
          pnpm wrangler delete ${{ steps.preview-names.outputs.web }} || echo "Web preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete API preview
        continue-on-error: true
        run: |
          cd apps/api-videos
          pnpm wrangler delete ${{ steps.preview-names.outputs.api }} || echo "API preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete processor preview
        continue-on-error: true
        run: |
          cd apps/processor
          pnpm wrangler delete ${{ steps.preview-names.outputs.processor }} || echo "Processor preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete websocket preview
        continue-on-error: true
        run: |
          cd apps/websocket-server
          pnpm wrangler delete ${{ steps.preview-names.outputs.websocket }} || echo "WebSocket preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete admin-api preview
        continue-on-error: true
        run: |
          cd apps/admin-api
          pnpm wrangler delete ${{ steps.preview-names.outputs.admin_api }} || echo "Admin API preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Delete admin-web preview
        continue-on-error: true
        run: |
          cd apps/admin-web
          pnpm wrangler delete ${{ steps.preview-names.outputs.admin_web }} || echo "Admin Web preview already deleted or doesn't exist"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Cleanup summary
        run: |
          echo "🧹 Preview cleanup completed for PR #${{ github.event.number }}"
          echo ""
          echo "Attempted to delete:"
          echo "  • ${{ steps.preview-names.outputs.web }}"
          echo "  • ${{ steps.preview-names.outputs.api }}"
          echo "  • ${{ steps.preview-names.outputs.processor }}"
          echo "  • ${{ steps.preview-names.outputs.websocket }}"
          echo "  • ${{ steps.preview-names.outputs.admin_api }}"
          echo "  • ${{ steps.preview-names.outputs.admin_web }}"
          echo ""
          echo "Note: Some workers may not exist if deployment failed earlier."

  # Deploy to QA Environment (develop branch only, requires approval)
  deploy-qa:
    needs: [build-web, build-admin-web, validate-api, validate-processor, validate-websocket, validate-admin-api]
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/develop'
    environment: qa
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
        timeout-minutes: 2

      - name: Download web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: web-build-artifacts
          path: apps/web/

      - name: Download admin-web build artifacts
        uses: actions/download-artifact@v6
        with:
          name: admin-web-build-artifacts
          path: apps/admin-web/

      - name: Deploy Web to QA
        run: |
          cd apps/web
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy API to QA
        run: |
          cd apps/api-videos
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Processor to QA
        run: |
          cd apps/processor
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy WebSocket Server to QA
        run: |
          cd apps/websocket-server
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin API to QA
        run: |
          cd apps/admin-api
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Deploy Admin Web to QA
        run: |
          cd apps/admin-web
          pnpm wrangler deploy --config wrangler.qa.jsonc
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

      - name: Notify QA deployment success
        if: success()
        run: |
          echo "🧪 QA deployment successful!"
          echo ""
          echo "QA Workers deployed:"
          echo "  • al-ummah-web-qa → qa.alummahnow.net"
          echo "  • videos-qa → videos.qa.api.alummahnow.net"
          echo "  • al-ummah-now-processor-qa"
          echo "  • al-ummah-now-comms-qa → ws.qa.alummahnow.net"
          echo "  • al-ummah-admin-api-qa → admin.qa.api.alummahnow.net"
          echo "  • al-ummah-admin-web-qa → admin.qa.alummahnow.net"
          echo ""
          echo "All 6 QA workers are live!"

