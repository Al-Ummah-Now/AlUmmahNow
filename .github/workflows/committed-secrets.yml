# Fails when the repo would publish a secret: a tracked .dev.vars*/.env* (other than
# *.example), a worker-configuration.d.ts / cloudflare-env.d.ts that types a secret as a
# literal value or was generated without `--env-file <*.example>`, or a high-confidence
# credential pattern in any tracked file. Prints fingerprints only, never values.
# Script: scripts/check-committed-secrets.mjs (run locally with --self-test too).
name: Committed Secrets

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan:
    name: Committed secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Self-test
        run: node scripts/check-committed-secrets.mjs --self-test
      - name: Scan tracked files
        run: node scripts/check-committed-secrets.mjs
      # The scanner every E2E job runs before uploading its report, traces and Lighthouse output
      # (scripts/ci/scan-artifacts-for-secrets.py): it fails closed, so prove it still finds a
      # leaked value in a trace zip, in the HTML report's embedded zip and in a storage state
      - name: Artifact secret scanner self-test
        run: python3 scripts/ci/scan-artifacts-for-secrets.py --self-test
