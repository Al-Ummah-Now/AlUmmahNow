name: Admin Web E2E (QA)

# Playwright UI suite for apps/admin-web, run against the deployed QA
# environment (admin.qa.alummahnow.net + admin.api.qa.alummahnow.net).
#
# Each job registers its own accounts (e2e+<run>-<attempt>-admin-<project>-<role>:
# a promoted admin and a viewer; apps/admin-web/e2e/support/env.ts) and files
# moderation reports under its own prefix, so jobs and runs do not share data and
# run in parallel. The teardown deletes the accounts when the job ends. The
# moderator role still signs in as the seed qa-moderator (no test route grants
# it); it only acts on the job's own reports.
#
# The three specs that change global state (the shared translations, the site
# theme, the legacy-profile restore) run once per run in the shared-state job,
# under the cross-run qa-global lock (scripts/ci/qa-lock.ts), which waits its
# turn instead of replacing a queued run the way a concurrency group did.

# Every admin spec is placed `local` (apps/web/e2e/test-utils/placement.ts): pull requests run the
# suite on the local stack (local-e2e.yml, "Local admin suite" jobs), not against QA. This workflow
# stays for a manual run against a deployed admin-web; it runs on no PR or schedule.
on:
  workflow_dispatch:
    inputs:
      admin_web_url:
        description: 'admin-web base URL'
        required: false
        default: 'https://admin.qa.alummahnow.net'

permissions:
  contents: read
  packages: read

# A newer push to a PR cancels that PR's older run only (its teardown still runs)
concurrency:
  group: admin-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  admin-e2e:
    name: Admin E2E - ${{ matrix.project }}
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 45
    # Forks do not receive secrets; the suite cannot log in without them
    # skip-qa-e2e on a PR: no QA traffic (see e2e-tests.yml)
    if: github.event_name != 'pull_request' || (github.event.pull_request.head.repo.full_name == github.repository && !contains(github.event.pull_request.labels.*.name, 'skip-qa-e2e'))

    permissions:
      contents: write  # only the qa-lock steps (shared-state) get the token
      actions: read
      packages: read

    strategy:
      fail-fast: false
      matrix:
        # shared-state: the global-state specs, under the qa-global lock
        project: [chromium, webkit, mobile, shared-state]

    env:
      CI: true
      ADMIN_WEB_URL: ${{ github.event.inputs.admin_web_url || 'https://admin.qa.alummahnow.net' }}
      ADMIN_API_URL: https://admin.api.qa.alummahnow.net
      VIDEOS_API_URL: https://videos.api.qa.alummahnow.net
      OPENAUTH_URL: https://auth.qa.alummahnow.net
      OPENAUTH_ISSUER_URL: https://auth.qa.alummahnow.net
      # qa-moderator (seed) still signs in with it
      QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
      # Run accounts register through auth's E2E code sink; the admin is promoted with TEST_PROMOTE_SECRET
      E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
      TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ADMIN_PROJECT: ${{ matrix.project }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The job token can write refs (the lock): keep it out of .git/config
          persist-credentials: false

      # The run accounts' password (random per job, masked) and the file every
      # generated account is listed in before it is registered
      - name: Run accounts
        run: |
          pw="Adm-$(openssl rand -base64 18 | tr '+/' '-_' | tr -d '=')-1!"
          echo "::add-mask::$pw"
          echo "E2E_RUN_USER_PASSWORD=$pw" >> "$GITHUB_ENV"
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Check QA credentials
        run: |
          for name in QA_SEED_PASSWORD E2E_CODE_SINK_SECRET TEST_PROMOTE_SECRET; do
            if [ -z "${!name}" ]; then
              echo "::error::$name secret is not available to this run"
              exit 1
            fi
          done

      - name: Acquire the qa-global lock
        id: lock
        if: matrix.project == 'shared-state'
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts acquire qa-global --ttl-min 50 --max-wait-min 85

      - name: Install Playwright browsers
        # Global setup always logs in with Chromium; WebKit only for its project
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/admin-web
          browsers: ${{ matrix.project == 'webkit' && 'chromium webkit' || 'chromium' }}

      - name: Run admin-web E2E suite
        working-directory: apps/admin-web
        timeout-minutes: 45
        # No Cloudflare token here (PR code runs in this step): 12-legacy-profiles skips, as before
        run: pnpm exec playwright test --project=${{ matrix.project }}

      - name: Release the qa-global lock
        if: always() && steps.lock.outputs.holder != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts release qa-global --holder "${{ steps.lock.outputs.holder }}"

      # Pass, fail or cancelled: delete this job's accounts from the auth server
      # (soft delete + immediate purge, QA-only route). Its reports were closed
      # by the suite's global teardown.
      - name: Size the account deletion
        id: teardown-size
        if: always()
        continue-on-error: true
        run: |
          m=$(node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts --auth-url "$OPENAUTH_ISSUER_URL" --file "$E2E_RUN_USERS_FILE" --step-minutes 2>/dev/null) || m=15
          case "$m" in ''|*[!0-9]*) m=15 ;; esac
          echo "minutes=$m" >> "$GITHUB_OUTPUT"

      - name: Delete the run accounts
        if: always()
        continue-on-error: true
        # Grows with the job's accounts (deleted 4 at a time, #1073)
        timeout-minutes: ${{ fromJSON(steps.teardown-size.outputs.minutes || '15') }}
        run: >-
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts
          --auth-url "$OPENAUTH_ISSUER_URL" --file "$E2E_RUN_USERS_FILE"

      # Artifacts of this public repo are downloadable by anyone signed in to
      # GitHub: drop any output that holds the seed password or a storage state,
      # then fail. 01-auth.spec.ts types the password (trace off there).
      - name: Scan test output for secrets
        if: always()
        run: >-
          python3 scripts/ci/scan-artifacts-for-secrets.py
          --env QA_SEED_PASSWORD
          --env E2E_CODE_SINK_SECRET
          --env TEST_PROMOTE_SECRET
          --env E2E_RUN_USER_PASSWORD
          --remove apps/admin-web/playwright-report apps/admin-web/test-results

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-report-${{ matrix.project }}
          path: apps/admin-web/playwright-report/
          retention-days: 30

      - name: Upload test results (traces, videos, JUnit)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: admin-e2e-results-${{ matrix.project }}
          path: apps/admin-web/test-results/
          retention-days: 14

      - name: Publish JUnit summary
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: apps/admin-web/test-results/junit.xml
          check_name: Admin E2E Results (${{ matrix.project }})
        continue-on-error: true
