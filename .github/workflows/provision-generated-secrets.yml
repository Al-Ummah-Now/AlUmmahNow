# Creates the secrets we generate ourselves (GENERATED_SECRETS in
# scripts/release/secrets-manifest.ts, e.g. the Web Push VAPID pair) in the
# Secrets Store for each env, ONLY when absent. Never overwrites (live state
# depends on the values) and never prints a value: generated in the runner,
# masked, sent straight to Cloudflare; the summary lists names and
# created/skipped only. Token: the release token (Secrets Store:Edit).
name: Provision generated secrets

on:
  workflow_dispatch:
    inputs:
      env:
        description: 'qa, stage, production, or all'
        type: choice
        options: [all, qa, stage, production]
        default: all
      dry_run:
        description: 'Only report what would be created'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: provision-generated-secrets
  cancel-in-progress: false

jobs:
  provision:
    name: Provision generated secrets (${{ inputs.env }})
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Create absent generated secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROVISION_ENV: ${{ inputs.env }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=(--env "$PROVISION_ENV")
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node --experimental-strip-types --no-warnings scripts/release/provision-generated-secrets.ts "${args[@]}"
