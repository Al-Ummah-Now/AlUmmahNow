# QA Bunny Stream library status (issue #929): video counts by status, the
# oldest pending encodes (and whether a live QA record still refers to them),
# storage and the library's encoding settings, as the job summary.
#
# The Stream API key exists only in the Cloudflare Secrets Store
# (bunny-stream-key-qa), so the job deploys a throwaway worker bound to the QA
# secrets (scripts/qa/bunny-qa-status/worker.js), calls it once with a random
# bearer token and deletes it. The key never reaches the runner or the log.
# Test library only (553336, QA + stage by name prefix): the bindings name the QA secrets and the QA and stage videos buckets, and the
# worker refuses to delete in any library other than QA_LIBRARY_ID.
#
# sweep: pages through the library (newest first, 100 a call) and deletes every
# QA video (no "[env] " name prefix, so never stage's) that no live QA record
# refers to: no record, or a record soft-deleted over 30 min ago. Kept: the
# theme-demo / pinned content (scripts/qa/theme-demo-keep.ts), anything younger
# than 1 h, live-stream references, unreadable records.
# timed_upload: apps/web/e2e/seed/timed-upload.ts.
name: Bunny QA Status

on:
  # Guard (2026-11-13: the test library was back at ~9,000 videos): every hour,
  # read the library; above GUARD_MAX videos warn and sweep (apply) at once.
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      sweep:
        description: 'Delete QA and stage test-library videos no live record of their env refers to (theme-demo keep list, other env, < 1 h and live streams kept). apply needs QA_LIBRARY_ID.'
        type: choice
        options: [none, dry-run, apply]
        default: none
      timed_upload:
        description: 'Upload one 10 s clip as qa-creator through the QA API and time it until ready (deleted after)'
        type: boolean
        default: false

permissions:
  contents: read
  # census: map run ids in titles to workflow runs
  actions: read

concurrency:
  group: bunny-qa-status
  cancel-in-progress: false

env:
  PROBE: bunny-qa-status-probe
  # The QA (and stage, by name prefix) Bunny Stream library. Never any other.
  QA_LIBRARY_ID: '553336'
  # Above this many videos the hourly run warns and sweeps (apply)
  GUARD_MAX: '500'

jobs:
  status:
    name: QA Bunny library status
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Deploy the probe
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          cd scripts/qa/bunny-qa-status
          token=$(openssl rand -hex 32)
          echo "::add-mask::$token"
          echo "PROBE_TOKEN=$token" >> "$GITHUB_ENV"
          printf '{"PROBE_TOKEN":"%s"}' "$token" > "$RUNNER_TEMP/probe-secrets.json"
          cat > wrangler.json <<JSON
          {
            "name": "$PROBE",
            "main": "worker.js",
            "compatibility_date": "2025-09-01",
            "workers_dev": true,
            "vars": { "QA_LIBRARY_ID": "$QA_LIBRARY_ID" },
            "r2_buckets": [
              { "binding": "videos", "bucket_name": "videos-qa" },
              { "binding": "videos_stage", "bucket_name": "videos-stage" },
              { "binding": "profiles", "bucket_name": "profiles-qa" },
              { "binding": "profiles_stage", "bucket_name": "profiles-stage" }
            ],
            "secrets_store_secrets": [
              { "binding": "BUNNY_KEY", "store_id": "f8eddc9944d041919ed8dc7d08d32308", "secret_name": "bunny-stream-key-qa" },
              { "binding": "BUNNY_LIBRARY_ID", "store_id": "f8eddc9944d041919ed8dc7d08d32308", "secret_name": "bunny-stream-library-id-qa" }
            ]
          }
          JSON
          npx -y wrangler@4.161.0 deploy --secrets-file "$RUNNER_TEMP/probe-secrets.json" 2>&1 | tee "$RUNNER_TEMP/deploy.txt"
          rm -f "$RUNNER_TEMP/probe-secrets.json"
          url=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' "$RUNNER_TEMP/deploy.txt" | head -1)
          test -n "$url"
          echo "PROBE_URL=$url" >> "$GITHUB_ENV"

      - name: Read the library
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5 6; do
            code=$(curl -sS -o "$RUNNER_TEMP/status.json" -w '%{http_code}' --max-time 120 -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL/status" || true)
            [ "$code" = 200 ] && break
            echo "attempt $i: HTTP $code $(head -c 300 "$RUNNER_TEMP/status.json" 2>/dev/null)"; sleep 10
          done
          test "$code" = 200
          { echo '### QA Bunny library'; echo '```json'; cat "$RUNNER_TEMP/status.json" | python3 -m json.tool; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Census by run (before any delete)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl -sS --fail --max-time 300 -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL/list" -o "$RUNNER_TEMP/listing.json"
          since=$(python3 -c 'import json,sys;r=json.load(open(sys.argv[1]))["rows"];d=min((x[2] for x in r if x[2]),default="2026-11-01");print(d[:10])' "$RUNNER_TEMP/listing.json")
          # Runs that could have uploaded: every workflow run since the oldest video (a day earlier for long runs)
          since=$(date -u -d "$since -1 day" +%Y-%m-%d)
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs?created=>=$since&per_page=100" \
            --jq '[.workflow_runs[] | {id, name, event, run_started_at, updated_at, run_attempt, head_branch}]' | python3 -c 'import json,sys;print(json.dumps([r for l in sys.stdin if l.strip() for r in json.loads(l)]))' > "$RUNNER_TEMP/runs.json"
          # Owners: record → profile → run account, 300 videos a call
          python3 - "$RUNNER_TEMP/listing.json" "$RUNNER_TEMP/owners.json" <<'PY'
          import json, os, sys, time, urllib.request
          rows = json.load(open(sys.argv[1]))['rows']
          out = {}
          for i in range(0, len(rows), 300):
              batch = rows[i:i + 300]
              body = json.dumps({'guids': [r[0] for r in batch], 'titles': {r[0]: r[1] for r in batch}}).encode()
              for attempt in range(4):
                  try:
                      req = urllib.request.Request(os.environ['PROBE_URL'] + '/owners', data=body, method='POST', headers={'Authorization': 'Bearer ' + os.environ['PROBE_TOKEN'], 'Content-Type': 'application/json', 'User-Agent': 'bunny-qa-status-ci/1.0'})
                      out.update(json.load(urllib.request.urlopen(req, timeout=120)))
                      break
                  except Exception as e:
                      print(f'owners batch {i}: {e}'); time.sleep(5)
          json.dump(out, open(sys.argv[2], 'w'))
          print(f'owners: {len(out)} of {len(rows)}')
          PY
          # Runs the owners name that the window above missed
          python3 -c 'import json,sys;r={str(x["id"]) for x in json.load(open(sys.argv[1]))};o=json.load(open(sys.argv[2]));print("\n".join(sorted({v["runId"] for v in o.values() if v.get("kind")=="run"}-r)))' "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/owners.json" > "$RUNNER_TEMP/missing.txt"
          echo "runs to look up: $(wc -l < "$RUNNER_TEMP/missing.txt")"
          while read -r id; do
            [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/runs/$id" --jq '{id, name, event, run_started_at, updated_at, run_attempt, head_branch}' 2>/dev/null || true
          done < "$RUNNER_TEMP/missing.txt" | python3 -c 'import json,sys;a=json.load(open(sys.argv[1]));a+=[json.loads(l) for l in sys.stdin if l.strip()];json.dump(a,open(sys.argv[1],"w"))' "$RUNNER_TEMP/runs.json"
          python3 scripts/qa/bunny-qa-status/census.py "$RUNNER_TEMP/listing.json" "$RUNNER_TEMP/runs.json" "$GITHUB_REPOSITORY" "$RUNNER_TEMP/owners.json" | tee "$RUNNER_TEMP/census.md" >> "$GITHUB_STEP_SUMMARY"
          mkdir -p census && cp "$RUNNER_TEMP/listing.json" "$RUNNER_TEMP/runs.json" "$RUNNER_TEMP/owners.json" "$RUNNER_TEMP/census.md" census/

      - name: Keep the census
        uses: actions/upload-artifact@v4
        with:
          name: bunny-census-${{ github.run_id }}
          path: census/
          retention-days: 30

      - name: Guard (more than ${{ env.GUARD_MAX }} videos)
        id: guard
        env:
          SWEEP_INPUT: ${{ inputs.sweep || 'none' }}
        run: |
          total=$(python3 -c 'import json,sys;print(json.load(open(sys.argv[1]))["total"])' "$RUNNER_TEMP/status.json")
          sweep="$SWEEP_INPUT"
          if [ "$total" -gt "$GUARD_MAX" ]; then
            echo "::warning title=Bunny test library over ${GUARD_MAX}::library $QA_LIBRARY_ID holds $total videos: test uploads are leaking (#929)"
            # The hourly run sweeps at once; a manual run keeps the mode it was given (dry-run stays dry)
            if [ "$GITHUB_EVENT_NAME" = schedule ]; then
              echo "- **guard: $total videos > $GUARD_MAX: sweeping (apply)**" >> "$GITHUB_STEP_SUMMARY"
              sweep=apply
            else
              echo "- **guard: $total videos > $GUARD_MAX**" >> "$GITHUB_STEP_SUMMARY"
            fi
          fi
          echo "sweep=$sweep" >> "$GITHUB_OUTPUT"

      - name: Sweep the library (${{ steps.guard.outputs.sweep }})
        if: steps.guard.outputs.sweep != 'none'
        env:
          SWEEP: ${{ steps.guard.outputs.sweep }}
        run: |
          set -euo pipefail
          apply=0; [ "$SWEEP" = apply ] && apply=1
          page=1; calls=0; total_deleted=0; total_candidates=0
          : > "$RUNNER_TEMP/sweep.jsonl"
          while [ $calls -lt 400 ]; do
            calls=$((calls+1))
            code=$(curl -sS -o "$RUNNER_TEMP/page.json" -w '%{http_code}' --max-time 120 -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL/sweep?page=$page&apply=$apply" || true)
            if [ "$code" != 200 ]; then echo "page $page: HTTP $code $(head -c 300 "$RUNNER_TEMP/page.json")"; sleep 5; continue; fi
            cat "$RUNNER_TEMP/page.json" >> "$RUNNER_TEMP/sweep.jsonl"; echo >> "$RUNNER_TEMP/sweep.jsonl"
            read -r listed deleted candidates <<<"$(python3 -c 'import json,sys;d=json.load(open(sys.argv[1]));print(d["listed"],d["deleted"],d["candidates"])' "$RUNNER_TEMP/page.json")"
            echo "page $page: listed $listed, candidates $candidates, deleted $deleted"
            total_deleted=$((total_deleted+deleted)); total_candidates=$((total_candidates+candidates))
            [ "$listed" = 0 ] && break
            # A page that lost videos gets the next ones moved up: list it again
            if [ "$deleted" -eq 0 ]; then page=$((page+1)); fi
          done
          python3 - "$RUNNER_TEMP/sweep.jsonl" "$SWEEP" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys, collections
          rows = [json.loads(l) for l in open(sys.argv[1]) if l.strip()]
          kept, would, deleted, envs, failed = collections.Counter(), collections.Counter(), collections.Counter(), collections.Counter(), []
          for r in rows:
              kept.update(r['kept']); deleted.update(r['deletedByStatus']); failed += r['failed']; envs.update(r.get('candidatesByEnv', {}))
              if sys.argv[2] != 'apply': would.update(r['wouldByStatus'])
          print(f'### Sweep ({sys.argv[2]})')
          print(f'- calls: {len(rows)}')
          print(f'- kept: {dict(kept)}')
          print(f'- unreferenced by env: {dict(envs)}')
          print(f'- would delete by status: {dict(would)} (total {sum(would.values())})' if sys.argv[2] != 'apply' else f'- deleted by status: {dict(deleted)} (total {sum(deleted.values())})')
          print(f'- failed: {len(failed)} {failed[:5]}')
          samples = [s for r in rows for s in r.get('sample', [])][:10]
          print('- sample:'); [print(f"  - {s['guid']} {s['status']} {s['title']}") for s in samples]
          PY

      - name: Read the library after the sweep
        if: steps.guard.outputs.sweep == 'apply'
        run: |
          curl -sS --max-time 120 -H "Authorization: Bearer $PROBE_TOKEN" "$PROBE_URL/status" | python3 -c 'import json,sys;d=json.load(sys.stdin);print("### After the sweep");[print(f"- {k}: {d.get(k)}") for k in ("total","storageGB","byStatus","byEnvStatus","pendingCount","qaPendingByRecord")]' | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Bunny status page
        if: always()
        run: |
          curl -sS --max-time 20 https://status.bunny.net/api/v2/summary.json -o "$RUNNER_TEMP/bunny-status.json" || exit 0
          python3 - "$RUNNER_TEMP/bunny-status.json" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, sys
          try:
              d = json.load(open(sys.argv[1]))
          except Exception as e:
              print(f'status page not JSON: {e}'); sys.exit(0)
          print('### status.bunny.net')
          print('- overall:', d.get('status', {}).get('description'))
          for c in d.get('components', []):
              if 'stream' in c.get('name', '').lower() or 'encod' in c.get('name', '').lower() or c.get('status') != 'operational':
                  print(f"- {c.get('name')}: {c.get('status')}")
          for i in d.get('incidents', []):
              print(f"- incident: {i.get('name')} ({i.get('status')}, {i.get('created_at')})")
          PY

      - name: Delete the probe
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@4.161.0 delete --name "$PROBE" --force || true

  timed-upload:
    name: Timed QA upload
    if: github.event_name == 'workflow_dispatch' && inputs.timed_upload
    needs: status
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the seed's tools
        working-directory: apps/web
        run: |
          mkdir -p "$RUNNER_TEMP/tools" && cd "$RUNNER_TEMP/tools" && npm init -y >/dev/null
          npm i --no-audit --no-fund @playwright/test@1.56.1 tsx@4.20.6 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
          echo "NODE_PATH=$RUNNER_TEMP/tools/node_modules" >> "$GITHUB_ENV"
          echo "$RUNNER_TEMP/tools/node_modules/.bin" >> "$GITHUB_PATH"

      - name: Install ffmpeg
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg fonts-dejavu-core

      - name: Upload and time
        working-directory: apps/web
        env:
          QA_SEED_PASSWORD: ${{ secrets.QA_SEED_PASSWORD }}
        run: |
          ln -sfn "$RUNNER_TEMP/tools/node_modules" node_modules
          tsx e2e/seed/timed-upload.ts
