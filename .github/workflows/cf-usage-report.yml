name: Cloudflare usage report

# Read-only: al-ummah's Cloudflare usage over the last N days, priced at list prices, per product,
# resource and env (scripts/ops/usage-report.ts). Only GET list calls and GraphQL Analytics reads;
# other projects on the shared account are filtered out before anything is fetched or printed.
# Runs by hand and on PRs that change the report itself.
on:
  workflow_dispatch:
    inputs:
      days:
        description: Days to cover (1-31)
        type: string
        default: '30'
      idle_since:
        description: Start of the idle window (ISO time; no test traffic since). Empty = last 24 h
        type: string
        default: ''
  pull_request:
    paths:
      - scripts/ops/usage-report.ts
      - .github/workflows/cf-usage-report.yml

permissions:
  contents: read

concurrency:
  group: cf-usage-report-${{ github.ref }}
  cancel-in-progress: true

jobs:
  report:
    # Fork PRs get no secrets
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Usage report
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DAYS: ${{ inputs.days || '30' }}
          # Tests left the deployed QA on 2026-11-13 ~15:00 UTC (9e620c5db reached QA)
          IDLE_SINCE: ${{ inputs.idle_since || '2026-11-13T16:00:00Z' }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/ops/usage-report.ts --days "$DAYS" | tee -a "$GITHUB_STEP_SUMMARY"
          # The idle window: the run rate with no test traffic, up to the last full hour
          until=$(date -u +%Y-%m-%dT%H:00:00Z)
          echo; echo '---'; echo
          node --experimental-strip-types --no-warnings scripts/ops/usage-report.ts --since "$IDLE_SINCE" --until "$until" | tee -a "$GITHUB_STEP_SUMMARY"
          echo; echo '---'; echo
          node --experimental-strip-types --no-warnings scripts/ops/usage-report.ts --hourly 36 | tee -a "$GITHUB_STEP_SUMMARY"
