name: Release

# Stage-then-promote for the seven workers (docs/release-pipeline/SPEC.md §7):
#   build once → stage (migrate, deploy the candidates through the same 0% → 100%
#   promote, smoke, seed) → stage E2E (release-e2e.yml) + live secrets check of stage
#   and production (secrets-check.yml) → production (tag still on main?, migrate,
#   candidates at 0%, pre-traffic smoke through the version override, 100%, smoke,
#   auto-rollback) → rollback dry run (resolves each worker's target, moves nothing).
# Nothing reaches production traffic without passing on stage first.
# Rollback: .github/workflows/rollback.yml or `pnpm release:rollback --env production`.
#
# When production moves is decided by a tag (CLAUDE.md "Deploy Rules"):
#   - push a tag vYYYY.MM.DD (vYYYY.MM.DD.N, N >= 2, for a later release that day) on a
#     commit on main → stage → stage E2E → production. Merging to main deploys QA only.
#   - workflow_dispatch on main → stage and stage E2E only; it never touches production.
# A tag with a bad name, or on a commit that is not on main, is refused before anything
# deploys. To re-run a failed release, re-run that tag's workflow run; never move a tag.
# Runs queue in one concurrency group; GitHub keeps only the newest pending run, so if
# two tags are pushed while a release is running, only the later one is released.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

# One release at a time, and never cancel one half-way through a promote
concurrency:
  group: release-aun
  cancel-in-progress: false

# The Cloudflare token is set only on the steps that call Cloudflare, never on
# install/build steps (dependency lifecycle scripts run there).

jobs:
  # Decides what this run is: a tag release (stage → production) or a stage-only run
  # from main. Refuses anything else before a single build minute is spent.
  resolve:
    name: Resolve release (tag on main?)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      tag: ${{ steps.kind.outputs.tag }}
      production: ${{ steps.kind.outputs.production }}
      label: ${{ steps.kind.outputs.label }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # all tags and origin/main, for the ancestry check and the changelog

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Tag release or stage-only run?
        id: kind
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            { echo "tag=$GITHUB_REF_NAME"; echo "production=true"; echo "label=$GITHUB_REF_NAME"; } >> "$GITHUB_OUTPUT"
          elif [ "$GITHUB_REF" = refs/heads/main ]; then
            { echo "production=false"; echo "label=stage ${GITHUB_SHA::7}"; } >> "$GITHUB_OUTPUT"
            echo "### Stage-only run of main@${GITHUB_SHA::7}. Production is released by pushing a tag." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::error::Releases run from a tag (production) or from main (stage only), not from $GITHUB_REF."
            exit 1
          fi

      - name: Valid tag on main?
        id: check
        if: steps.kind.outputs.production == 'true'
        run: node --experimental-strip-types --no-warnings scripts/release/release-tag.ts check "$GITHUB_REF_NAME" "$GITHUB_SHA"

      - name: Changes in this release
        if: steps.kind.outputs.production == 'true'
        env:
          PREV: ${{ steps.check.outputs.previous }}
        run: |
          {
            echo "### Release $GITHUB_REF_NAME (${GITHUB_SHA::7})"
            if [ -n "$PREV" ]; then
              echo "Changes since $PREV:"
              echo '```'
              git log --oneline --no-decorate "$PREV..$GITHUB_SHA"
              echo '```'
            else
              echo "First tagged release."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build once (${{ matrix.part }})
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      matrix:
        part: [workers, web, admin-web]
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Release checks (wrangler configs, release scripts)
        if: matrix.part == 'workers'
        run: |
          pnpm check:config
          pnpm test:scripts

      # Bundles are env-independent (no build-time defines): the same files are
      # uploaded to stage and to production with --no-bundle.
      - name: Bundle the plain workers
        if: matrix.part == 'workers'
        run: |
          for app in api-videos processor websocket-server scheduler admin-api; do
            (cd "apps/$app" && pnpm wrangler deploy --dry-run -c wrangler.jsonc --outdir "../../dist/$app")
            test -f "dist/$app/index.js"
          done

      # One OpenNext build per Next app; API_URL, WEBSOCKET_URL, the issuer and the
      # client id are read at runtime from each env's wrangler vars, so the same
      # build serves QA, stage and production (deploy.yml already ships one build
      # to QA and production).
      # NEXT_DEPLOYMENT_ID: one id per build, for skew protection (promote.ts bakes
      # the id -> Worker version mapping into each upload). The action key is the
      # same for every release build, so an unchanged Server Action keeps its id
      # across deploys (Next salts ids with it); stage and production share it
      # because they run the same build. docs/release-pipeline/SKEW-PROTECTION.md
      - name: Build ${{ matrix.part }} (OpenNext)
        if: matrix.part != 'workers'
        env:
          NEXT_SERVER_ACTIONS_ENCRYPTION_KEY: ${{ secrets.NEXT_SERVER_ACTIONS_ENCRYPTION_KEY }}
        run: |
          export NEXT_DEPLOYMENT_ID="${GITHUB_SHA::12}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [ -z "$NEXT_SERVER_ACTIONS_ENCRYPTION_KEY" ]; then
            echo "::error::NEXT_SERVER_ACTIONS_ENCRYPTION_KEY is not set: every release would rename every Server Action"
            exit 1
          fi
          pnpm --filter "@al-ummah/${{ matrix.part }}" build
          cd "apps/${{ matrix.part }}" && pnpm opennextjs-cloudflare build

      - uses: actions/upload-artifact@v4
        with:
          name: release-${{ matrix.part }}
          path: ${{ matrix.part == 'workers' && 'dist/' || format('apps/{0}/.open-next/', matrix.part) }}
          include-hidden-files: true
          retention-days: 30

  stage:
    name: Stage (migrate, deploy, smoke, seed)
    needs: [resolve, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: staging
      url: https://videos.stage.alummahnow.net
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # wrangler re-bundles the web worker (worker.ts imports @al-ummah/logger) at
      # upload, and the seed imports web code: both need the workspace packages'
      # dist/, which only the build job made until now. Build them right after install.
      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - uses: actions/download-artifact@v4
        with:
          name: release-workers
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: apps/web/.open-next/
      - uses: actions/download-artifact@v4
        with:
          name: release-admin-web
          path: apps/admin-web/.open-next/

      # Queues and buckets new bindings need (scripts/release/ensure-resources.ts), then the web
      # apps' browser source maps: uploaded to the private bucket and removed from the assets
      # (scripts/release/upload-sourcemaps.ts; the Errors page symbolicates with them)
      - name: Ensure stage resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/ensure-resources.ts --env stage

      - name: Upload private source maps (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env stage --app web --release "${GITHUB_SHA::12}"
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env stage --app admin-web --release "${GITHUB_SHA::12}"

      # Expand-only migrations, rehearsed here before production gets them
      - name: Migrate stage databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:migrate --env stage

      # Same mechanics as production, so every release also rehearses the promote.
      # A stage worker that does not exist yet is created by its first deploy.
      - name: Deploy candidates to stage (0% + override smoke → 100% → smoke)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: pnpm release:promote --env stage --message "release $RELEASE_LABEL"

      # versions upload does not register queue consumers (admin-api: auth-moderation-requests-stage)
      - name: Queue consumers (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:queue-consumers --config apps/admin-api/wrangler.jsonc --env stage

      # Platform analytics collector (apps/cost-monitor, docs/admin/LIVE_OPS.md): crons only, no
      # route, so no smoke; its D1 was migrated with the others (d1-migrate.ts).
      - name: Deploy cost monitor (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: |
          cd apps/cost-monitor
          pnpm wrangler deploy -c wrangler.jsonc --env stage --message "release $RELEASE_LABEL"

      # R2 video delivery (apps/media, epic #687). Containers take no versions upload, so the
      # media worker (and its transcoder image, built here with Docker and pushed to Cloudflare's
      # registry) is deployed with `wrangler deploy` once the promote above passed its smoke,
      # then smoke-tested itself; a failed smoke rolls the media worker back.
      - name: Deploy media (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: |
          cd apps/media
          pnpm wrangler deploy -c wrangler.jsonc --env stage --message "release $RELEASE_LABEL"

      - name: Media smoke (stage)
        id: media_smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/media-smoke.ts --env stage

      - name: Roll back media (smoke failed)
        if: failure() && steps.media_smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/media
          pnpm wrangler rollback -c wrangler.jsonc --env stage --message "release ${GITHUB_SHA::7}: media smoke failed" -y
          echo "### Rolled back: media smoke failed (stage)" >> "$GITHUB_STEP_SUMMARY"

      # Media host settings (scripts/media-cdn/apply.ts, idempotent): R2 custom domain, CORS, the
      # Cache Rule, Smart Tiered Cache, and checks that the token can purge and read analytics.
      # The release token carries the zone permissions (Cache Settings, Cache Purge, DNS) and
      # Account Analytics Read. A problem here is a warning: the media host still serves.
      - name: Media CDN settings (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/media-cdn/apply.ts --env stage --apply \
            || echo "::warning title=Media CDN settings::scripts/media-cdn/apply.ts --env stage did not finish; see the log above"
      # Fills columns added by a migration, once the new worker writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env stage
          pnpm release:content-columns --env stage --check

      - name: Stage result
        if: always()
        run: |
          if [ -f release-result.json ]; then
            { echo '### Stage release'; echo '```json'; cat release-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      # Translation store (global_settings R2, #982): repo text wins for every
      # key not on a file's overrides list (admin edits are kept), removed keys
      # are dropped, missing files are seeded. Summary: "translations: N updated, M kept".
      - name: Sync translations with the repo (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/release/sync-translations.ts --env stage

      # Smoke: fails when a non-override key differs from the repo, or the API does not serve both locales
      - name: Check translations match the repo (stage)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/release/sync-translations.ts --env stage --check

      # Idempotent stage data for the release E2E (accounts, channels, encoded
      # videos, playlists): everything already there is found and skipped. Stage
      # accounts register through the auth E2E code sink (apps/web/e2e/seed).
      - name: Install Chromium (stage seed)
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: chromium

      - name: Install ffmpeg and fonts (stage seed)
        uses: ./.github/actions/apt-install
        with:
          packages: ffmpeg fonts-dejavu-core

      - name: Seed stage (idempotent)
        working-directory: apps/web
        run: npx tsx e2e/seed/seed-qa.ts
        env:
          CI: true
          SEED_MODE: apply
          SEED_MEDIA_DIR: ${{ runner.temp }}/seed-stage-media
          QA_SEED_PASSWORD: ${{ secrets.STAGE_SEED_PASSWORD }}
          SEED_EMAIL_DOMAIN: e2e.alummahnow.net
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_STAGE }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_BIN: ${{ github.workspace }}/node_modules/.bin/wrangler
          OPENAUTH_URL: https://auth.stage.alummahnow.net
          WEB_APP_URL: https://videos.stage.alummahnow.net
          API_URL: https://videos.api.stage.alummahnow.net
          OPENAUTH_CLIENT_ID: f0de3c30-0304-4ac4-86d6-1e185dec0439
          D1_DATABASE_NAME: al-ummah-now-d1-stage
          D1_DATABASE_ID: c7886ef6-c70b-4b7f-a65b-3df9f9aba9e2
          SEARCH_D1_DATABASE_NAME: al-ummah-now-search-stage
          SEARCH_D1_DATABASE_ID: 956a3550-bd20-4cfc-9bf2-b1c2265b33dd

  # Release regressions against the stage candidates (now serving stage traffic):
  # sign-up/sign-in on web, profile and admin, callback errors, playback, watch
  # history and uploads. Same suite as every PR runs against QA.
  stage-e2e:
    name: Stage E2E
    needs: stage
    # release-e2e.yml takes the stage-global lock (a git ref) for its shared-state specs
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/release-e2e.yml
    with:
      env: stage
    secrets:
      E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_STAGE }}
      TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_STAGE }}

  # Live secrets check (scripts/release/check-secrets.ts, manifest in
  # secrets-manifest.ts): every worker has its required secrets, no binding points
  # at a deleted Secrets Store secret, no test-only secret in production, and every
  # ClientId is enabled in that env's auth D1. Prints names only, never values.
  # Stage is checked after its deploy (a new stage worker is created by it);
  # production before the promote. Both gate the production job.
  secrets-stage:
    name: Secrets (stage)
    needs: stage
    uses: ./.github/workflows/secrets-check.yml
    with:
      env: stage
    secrets: inherit

  secrets-production:
    name: Secrets (production)
    needs: resolve
    if: needs.resolve.outputs.production == 'true'
    uses: ./.github/workflows/secrets-check.yml
    with:
      env: production
    secrets: inherit

  # Emergency override: while the repository variable RELEASE_SKIP_STAGE_E2E is
  # "true", a failed stage E2E no longer blocks production (it still runs and
  # reports). Stage deploy and both secrets checks must still pass, and the
  # production 0% smoke still gates the promote. Unset the variable afterwards.
  production:
    name: Production (migrate, 0% smoke, promote)
    needs: [resolve, stage, stage-e2e, secrets-stage, secrets-production]
    if: >-
      always() &&
      needs.resolve.outputs.production == 'true' &&
      needs.stage.result == 'success' &&
      needs.secrets-stage.result == 'success' &&
      needs.secrets-production.result == 'success' &&
      (needs.stage-e2e.result == 'success' ||
       (vars.RELEASE_SKIP_STAGE_E2E == 'true' && needs.stage-e2e.result == 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment:
      name: production
      url: https://videos.alummahnow.net
    steps:
      - uses: actions/checkout@v4

      # The release deploys exactly the tagged commit, so later merges to main don't
      # matter. A tag that was deleted or moved while stage ran is not promoted.
      - name: Tag still points at this commit?
        env:
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          now=$(git ls-remote origin "refs/tags/$TAG^{}" | cut -f1)
          [ -n "$now" ] || now=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)
          if [ "$now" != "$GITHUB_SHA" ]; then
            echo "::error::$TAG now points at '${now::7}', not ${GITHUB_SHA::7}; not promoting. Tags are never moved: cut a new tag."
            exit 1
          fi

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # wrangler re-bundles the web worker (worker.ts imports @al-ummah/logger) at
      # upload, and the seed imports web code: both need the workspace packages'
      # dist/, which only the build job made until now. Build them right after install.
      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - uses: actions/download-artifact@v4
        with:
          name: release-workers
          path: dist/
      - uses: actions/download-artifact@v4
        with:
          name: release-web
          path: apps/web/.open-next/
      - uses: actions/download-artifact@v4
        with:
          name: release-admin-web
          path: apps/admin-web/.open-next/

      # Queues and buckets new bindings need (scripts/release/ensure-resources.ts), then the web
      # apps' browser source maps: uploaded to the private bucket and removed from the assets
      # (scripts/release/upload-sourcemaps.ts; the Errors page symbolicates with them)
      - name: Ensure production resources
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/ensure-resources.ts --env production

      - name: Upload private source maps (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env production --app web --release "${GITHUB_SHA::12}"
          node --experimental-strip-types --no-warnings scripts/release/upload-sourcemaps.ts --env production --app admin-web --release "${GITHUB_SHA::12}"

      - name: Migrate production databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:migrate --env production

      - name: Promote (0% + override smoke → 100% → smoke, auto-rollback)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: pnpm release:promote --env production --message "release $RELEASE_LABEL"

      # Translation store (global_settings R2, #982): repo text wins for every
      # key not on a file's overrides list (admin edits are kept), removed keys
      # are dropped, missing files are seeded. Summary: "translations: N updated, M kept".
      - name: Sync translations with the repo (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/release/sync-translations.ts --env production

      # Smoke: fails when a non-override key differs from the repo, or the API does not serve both locales
      - name: Check translations match the repo (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm exec tsx scripts/release/sync-translations.ts --env production --check

      # versions upload does not register queue consumers (admin-api: auth-moderation-requests)
      - name: Queue consumers (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm release:queue-consumers --config apps/admin-api/wrangler.jsonc

      # Platform analytics collector (apps/cost-monitor, docs/admin/LIVE_OPS.md): crons only, no
      # route, so no smoke; its D1 was migrated with the others (d1-migrate.ts).
      - name: Deploy cost monitor (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: |
          cd apps/cost-monitor
          pnpm wrangler deploy -c wrangler.jsonc --message "release $RELEASE_LABEL"

      # R2 video delivery (apps/media, epic #687). Containers take no versions upload, so the
      # media worker (and its transcoder image, built here with Docker and pushed to Cloudflare's
      # registry) is deployed with `wrangler deploy` once the promote above passed its smoke,
      # then smoke-tested itself; a failed smoke rolls the media worker back.
      - name: Deploy media (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          RELEASE_LABEL: ${{ needs.resolve.outputs.label }}
        run: |
          cd apps/media
          pnpm wrangler deploy -c wrangler.jsonc --message "release $RELEASE_LABEL"

      - name: Media smoke (production)
        id: media_smoke
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/media-smoke.ts --env production

      - name: Roll back media (smoke failed)
        if: failure() && steps.media_smoke.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          cd apps/media
          pnpm wrangler rollback -c wrangler.jsonc --message "release ${GITHUB_SHA::7}: media smoke failed" -y
          echo "### Rolled back: media smoke failed (production)" >> "$GITHUB_STEP_SUMMARY"

      # Media host settings (scripts/media-cdn/apply.ts, idempotent): R2 custom domain, CORS, the
      # Cache Rule, Smart Tiered Cache, and checks that the token can purge and read analytics.
      # The release token carries the zone permissions (Cache Settings, Cache Purge, DNS) and
      # Account Analytics Read. A problem here is a warning: the media host still serves.
      - name: Media CDN settings (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          node --experimental-strip-types --no-warnings scripts/media-cdn/apply.ts --env production --apply \
            || echo "::warning title=Media CDN settings::scripts/media-cdn/apply.ts --env production did not finish; see the log above"
      # Fills columns added by a migration, once the new worker writes them. Fails the deploy if any row is left.
      - name: Backfill and verify Studio columns (production)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:content-columns --env production
          pnpm release:content-columns --env production --check

      - name: Install Chromium
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: chromium

      # One test-release-*@delivered.resend.dev account signs up (code via the
      # Resend API), signs in on web and profile, and is refused by admin.
      - name: Production signed-in check
        id: signedin
        working-directory: apps/web
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          PROD_USER_FILE: ${{ runner.temp }}/prod-test-users
        run: pnpm exec playwright test -c playwright.release-prod.config.ts

      - name: Delete production test accounts
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PROD_USER_FILE: ${{ runner.temp }}/prod-test-users
        run: |
          if [ -s "$PROD_USER_FILE" ]; then
            node --experimental-strip-types --no-warnings scripts/release/delete-test-user.ts "$PROD_USER_FILE"
          else
            echo "no production test accounts were created"
          fi

      # Guard: nothing a test account created may stay on production, from this run or any
      # other (a probe run by hand included). Deletes what it finds, then still fails the job.
      - name: Production holds no test data
        if: always()
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/release/check-prod-test-data.ts --delete

      - name: Roll back (signed-in check failed)
        if: failure() && steps.signedin.outcome == 'failure'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          pnpm release:rollback --env production --reason "release ${GITHUB_SHA::7}: production signed-in check failed"
          echo "### Rolled back: production signed-in check failed on ${GITHUB_SHA::7}" >> "$GITHUB_STEP_SUMMARY"

      - name: Production result
        if: always()
        run: |
          if [ -f release-result.json ]; then
            { echo '### Production release'; echo '```json'; cat release-result.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-result
          path: release-result.json
          if-no-files-found: ignore
          retention-days: 90

  # Proves the one-command rollback can act on what was just released: resolves
  # each production worker's rollback target and stops before moving traffic.
  rollback-dry-run:
    name: Rollback dry run (production)
    needs: production
    # Runs whenever production was promoted, including releases that used the
    # RELEASE_SKIP_STAGE_E2E override (a failed stage E2E upstream would otherwise skip it)
    if: always() && needs.production.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve rollback targets (no traffic moved)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          pnpm release:rollback --env production --dry-run | tee rollback-dry-run.txt
          { echo '### Rollback dry run (production)'; echo '```'; cat rollback-dry-run.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
