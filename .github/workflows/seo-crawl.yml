name: Weekly SEO crawl

# Wiki AUN-SEO, Monitoring 4: a read-only crawl of production as a search engine sees it. It reads
# robots.txt and the sitemaps of the videos site and www, samples 200 pages (stable per day) and checks
# status, robots, title, description, canonical, JSON-LD and signed media URLs, with plain GETs (no
# JavaScript, cookies or accounts; never creates anything). Problems go to one issue (label seo-crawl),
# rewritten each run and closed after a clean one (scripts/ops/seo-crawl.ts).

on:
  schedule:
    - cron: '23 6 * * 1' # Mondays 06:23 UTC
  workflow_dispatch:
    inputs:
      sample:
        description: Pages to sample
        required: false
        default: '200'

permissions:
  contents: read
  issues: write

concurrency:
  group: seo-crawl
  cancel-in-progress: false

jobs:
  crawl:
    name: Crawl production sitemaps
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Crawl and report
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SAMPLE: ${{ inputs.sample || '200' }}
        run: >-
          node --experimental-strip-types --no-warnings scripts/ops/seo-crawl.ts
          --sample "$SAMPLE"
          --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
