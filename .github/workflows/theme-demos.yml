# Prototype only, on proto/theme-demos. Temporary theme demos backed by QA. Never merge.
name: Theme demos
on:
  push:
    branches: [proto/theme-demos]
concurrency: { group: theme-demos, cancel-in-progress: true }
jobs:
  demo:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        theme: [lantern, zujaj, nahas, fawanees]
    env:
      ACTIVE_THEME: ${{ matrix.theme }}
      NEXT_PUBLIC_ACTIVE_THEME: ${{ matrix.theme }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with: { version: 9.15.4 }
      - uses: actions/setup-node@v6
        with: { node-version: '22', cache: pnpm }
      - run: pnpm install --frozen-lockfile
        env: { NODE_AUTH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
      - name: Build the active theme
        run: |
          node --experimental-strip-types --no-warnings packages/fanous-tokens/src/cli.ts build --out apps/web/src/theme/active
          node apps/web/scripts/theme-demo-css.mjs
      - name: Build web
        run: |
          pnpm --filter @al-ummah/web build
          cd apps/web && pnpm opennextjs-cloudflare build
      - name: Deploy
        id: deploy
        working-directory: apps/web
        run: |
          pnpm wrangler deploy --config wrangler.demo.jsonc --name "theme-demo-${{ matrix.theme }}" | tee deploy.log
          grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1 | sed 's/^/Demo: /' >> "$GITHUB_STEP_SUMMARY"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
