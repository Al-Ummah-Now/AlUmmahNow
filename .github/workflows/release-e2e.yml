name: Release regressions

# The release E2E suite (apps/web/e2e/release, playwright.release.config.ts):
# web/profile/admin-web sign-in, callback errors, playback, watch history and
# uploads, each spec with its own new sink user. Runs against QA on every PR
# into main, and against stage from the release workflow (workflow_call with
# env: stage). Independent of the legacy E2E suite (e2e-tests.yml).
#
# It needs only @playwright/test, so it does not install the monorepo (no
# GitHub Packages token, no build). Only the test step sees secrets.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      env:
        description: 'Target environment'
        type: choice
        options: [qa, stage]
        default: qa
  workflow_call:
    inputs:
      env:
        description: 'Target environment: qa or stage (never production)'
        type: string
        required: true
      ref:
        description: 'Git ref of the specs to run (default: the calling commit)'
        type: string
        required: false
        default: ''
    secrets:
      E2E_CODE_SINK_SECRET:
        description: 'Auth server code sink secret for the target env'
        required: true
      TEST_PROMOTE_SECRET:
        description: 'Auth server /test/promote secret for the target env (admin-web spec skips without it)'
        required: false

permissions:
  contents: read

concurrency:
  group: release-e2e-${{ inputs.env || 'qa' }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  release-e2e:
    name: Release regressions (${{ inputs.env || 'qa' }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      E2E_ENV: ${{ inputs.env || 'qa' }}
      PLAYWRIGHT_VERSION: 1.56.1  # keep in step with apps/web/package.json
    steps:
      - name: Check target
        run: |
          case "$E2E_ENV" in
            qa|stage) ;;
            *) echo "::error::env must be qa or stage, got '$E2E_ENV'"; exit 1 ;;
          esac

      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || '' }}

      # The artifact scanner comes from this workflow's own commit, never from
      # inputs.ref: it runs with the secrets in its env.
      - name: Check out the artifact scanner (trusted)
        uses: actions/checkout@v4
        with:
          path: .ci-trusted
          sparse-checkout: scripts/ci
          persist-credentials: false

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      # Same layout as a local run: the release specs, the code-sink helper,
      # the fixtures and the config, next to a standalone @playwright/test.
      - name: Prepare the suite
        run: |
          SUITE="$RUNNER_TEMP/release-e2e"
          mkdir -p "$SUITE/e2e/test-utils"
          cp -R apps/web/e2e/release apps/web/e2e/test-fixtures "$SUITE/e2e/"
          cp apps/web/e2e/test-utils/code-sink.ts "$SUITE/e2e/test-utils/"
          cp apps/web/playwright.release.config.ts "$SUITE/"
          cd "$SUITE"
          npm init -y > /dev/null
          npm install --no-audit --no-fund "@playwright/test@$PLAYWRIGHT_VERSION"
          echo "SUITE=$SUITE" >> "$GITHUB_ENV"

      # chromium for the auth flows, branded Chrome for real H.264 playback
      - name: Install browsers
        working-directory: ${{ env.SUITE }}
        run: npx playwright install --with-deps chromium chrome

      # One password for this run's throwaway users, known to the workflow so
      # the artifact scan below can look for it (targets.ts TEST_PASSWORD).
      - name: Generate the test password
        run: |
          pw="Rel-$(openssl rand -base64 18 | tr '+/' '-_' | tr -d '=')-1!"
          echo "::add-mask::$pw"
          echo "E2E_TEST_PASSWORD=$pw" >> "$GITHUB_ENV"

      - name: Run release regressions
        working-directory: ${{ env.SUITE }}
        env:
          CI: 'true'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET || (inputs.env == 'stage' && secrets.E2E_CODE_SINK_SECRET_STAGE) || secrets.E2E_CODE_SINK_SECRET_QA }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET || (inputs.env == 'stage' && secrets.TEST_PROMOTE_SECRET_STAGE) || secrets.TEST_PROMOTE_SECRET_QA }}
        run: npx playwright test -c playwright.release.config.ts

      # Artifacts of this public repo are downloadable by anyone signed in to
      # GitHub: drop any report/trace that holds a secret or a storage state,
      # then fail. Sign-in specs fill secrets in-page with trace off (secret-fill.ts).
      - name: Scan test output for secrets
        if: always()
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET || (inputs.env == 'stage' && secrets.E2E_CODE_SINK_SECRET_STAGE) || secrets.E2E_CODE_SINK_SECRET_QA }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET || (inputs.env == 'stage' && secrets.TEST_PROMOTE_SECRET_STAGE) || secrets.TEST_PROMOTE_SECRET_QA }}
        run: >-
          python3 .ci-trusted/scripts/ci/scan-artifacts-for-secrets.py
          --env E2E_TEST_PASSWORD --env E2E_CODE_SINK_SECRET --env TEST_PROMOTE_SECRET
          --remove "$SUITE/release-report" "$SUITE/test-results"

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-regressions-${{ env.E2E_ENV }}
          path: |
            ${{ env.SUITE }}/release-report/
            ${{ env.SUITE }}/test-results/
          retention-days: 14
