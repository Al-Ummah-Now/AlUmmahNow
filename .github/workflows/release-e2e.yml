name: Release regressions (web)

# R1 (sign-up → code → sign-in, sign-in and add-account redirect_uri) and R4
# (callbacks never answer with raw JSON) against QA on every PR; the release
# workflow (phase 7) runs the same specs against stage with E2E_ENV=stage.
# Independent of the legacy E2E suite (#185): no seeded users, no global setup;
# verification codes come from the auth server's E2E sink (QA/stage only).

on:
  pull_request:
    branches: [main, 'integrate/**']
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  release-e2e:
    name: Release regressions (QA)
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Chromium
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run release regressions against QA
        working-directory: apps/web
        env:
          E2E_ENV: qa
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
        run: pnpm exec playwright test -c playwright.release.config.ts

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: release-regressions-report
          path: |
            apps/web/release-report/
            apps/web/test-results/
          retention-days: 14
