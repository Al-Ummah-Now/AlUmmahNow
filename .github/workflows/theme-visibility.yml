name: Theme visibility

# Every built-in site theme x light/dark x en/ar x desktop/phone: rendered text contrast (pixels, not
# computed styles) and axe colour-contrast on the header popovers and other overlays. Runs against a
# local `next dev` with a local session cookie and mocked API answers: no QA environment, no secrets.

on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths:
      - 'apps/web/src/**'
      - 'apps/web/e2e/themes/**'
      - 'apps/web/playwright.themes.config.ts'
      - 'packages/fanous-tokens/**'
      - 'packages/theme-packages/**'
      - '.github/workflows/theme-visibility.yml'

permissions:
  contents: read
  packages: read

concurrency:
  group: theme-visibility-${{ github.ref }}
  cancel-in-progress: true

jobs:
  theme-visibility:
    name: Theme visibility - ${{ matrix.project }}
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        project: [desktop, phone]

    env:
      CI: true
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path)" >> "$GITHUB_OUTPUT"

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: chromium

      - name: Run theme visibility specs
        working-directory: apps/web
        run: pnpm exec playwright test -c playwright.themes.config.ts --project=${{ matrix.project }}

      - name: Upload screenshots and failure artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: theme-visibility-${{ matrix.project }}
          path: apps/web/test-results-themes/
          retention-days: 14
