name: Media diagnostics

# Read-only: the R2 transcode pipeline (apps/media) of one environment, as Cloudflare sees it:
# media Worker deployments, transcode queue + DLQ backlog, the Transcoder container application and
# its instances, and the warn/error logs of media, videos and admin-api (scripts/ops/media-diagnostics.ts).
# GET reads, the GraphQL Analytics read and the Observability query only; no app endpoint is called
# and nothing is changed. The log is public: scripts/ops/scrub.ts drops secrets and people's data and shortens ids.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [production, stage, qa]
        default: production
      hours:
        description: Hours back (1-72)
        type: string
        default: '6'
      search:
        description: Only log lines containing this text (empty = all warn/error lines)
        type: string
        default: ''
      originals:
        description: "Only check the stored originals of uploads that failed with no_video_stream (at most 10; production or stage)"
        type: boolean
        default: false
  pull_request:
    paths:
      - scripts/ops/media-diagnostics.ts
      - scripts/ops/scrub.ts
      - scripts/ops/upload-originals.ts
      - .github/workflows/media-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: media-diagnostics
  cancel-in-progress: false

jobs:
  report:
    # Fork PRs get no secrets
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Tests
        run: node --experimental-strip-types --no-warnings --test scripts/ops/__tests__/upload-originals.test.ts scripts/ops/__tests__/scrub.test.ts
      # Reads the failed originals' bytes from R2 into a temporary folder, prints sizes, hash equality and stream
      # types only (scripts/ops/upload-originals.ts). A PR run reads stage.
      - name: Originals of failed uploads
        if: inputs.originals || github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV_NAME: ${{ inputs.env || 'stage' }}
          HOURS: ${{ inputs.hours || '48' }}
        run: |
          set -o pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends ffmpeg >/dev/null
          node --experimental-strip-types --no-warnings scripts/ops/upload-originals.ts --env "$ENV_NAME" --hours "$HOURS" | tee -a "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: ${{ !inputs.originals }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV_NAME: ${{ inputs.env || 'production' }}
          HOURS: ${{ inputs.hours || '8' }}
          SEARCH: ${{ inputs.search }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/ops/media-diagnostics.ts --env "$ENV_NAME" --hours "$HOURS" --search "$SEARCH" | tee -a "$GITHUB_STEP_SUMMARY"
          # On a PR that changes the report: stage too, for comparison
          if [ "${{ github.event_name }}" = pull_request ]; then
            node --experimental-strip-types --no-warnings scripts/ops/media-diagnostics.ts --env stage --hours "$HOURS" | tee -a "$GITHUB_STEP_SUMMARY"
          fi
