name: Media diagnostics

# Read-only: the R2 transcode pipeline (apps/media) of one environment, as Cloudflare sees it:
# media Worker deployments, transcode queue + DLQ backlog, the Transcoder container application and
# its instances, and the warn/error logs of media, videos and admin-api (scripts/ops/media-diagnostics.ts).
# GET reads, the GraphQL Analytics read and the Observability query only; no app endpoint is called
# and nothing is changed.
#
# The log and the summary are public: they get the allow list of scripts/ops/public-report.ts only. The full report
# is the artifact, encrypted on the runner (scripts/ops/seal.ts); scripts/ops/open-report.ts opens it with the
# private key, which is in no repository and on no runner. A pull request reads stage only, public part only.
on:
  workflow_dispatch:
    inputs:
      env:
        description: Environment
        type: choice
        options: [production, stage, qa]
        default: production
      hours:
        description: Hours back (1-72)
        type: string
        default: '6'
      search:
        description: "Only log lines containing this text (empty = all warn/error lines). Public: never an id or a name"
        type: string
        default: ''
  pull_request:
    paths:
      - scripts/ops/media-diagnostics.ts
      - scripts/ops/public-report.ts
      - scripts/ops/seal.ts
      - scripts/ops/scrub.ts
      - scripts/ops/__tests__/**
      - .github/workflows/media-diagnostics.yml

permissions:
  contents: read

concurrency:
  group: media-diagnostics
  cancel-in-progress: false

jobs:
  report:
    # Fork PRs get no secrets
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Tests
        run: node --experimental-strip-types --no-warnings --test scripts/ops/__tests__/media-diagnostics.test.ts scripts/ops/__tests__/public-report.test.ts scripts/ops/__tests__/seal.test.ts scripts/ops/__tests__/scrub.test.ts
      - name: Diagnostics (stage, public part)
        if: github.event_name == 'pull_request'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node --experimental-strip-types --no-warnings scripts/ops/media-diagnostics.ts --env stage --hours 8 | tee "$GITHUB_STEP_SUMMARY"
      - name: Diagnostics
        if: github.event_name == 'workflow_dispatch'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ENV_NAME: ${{ inputs.env }}
          HOURS: ${{ inputs.hours }}
          SEARCH: ${{ inputs.search }}
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings scripts/ops/media-diagnostics.ts --env "$ENV_NAME" --hours "$HOURS" --search "$SEARCH" --sealed report.sealed.json | tee "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && github.event_name == 'workflow_dispatch' }}
        with:
          name: media-diagnostics-${{ inputs.env }}
          path: report.sealed.json
          retention-days: 7
