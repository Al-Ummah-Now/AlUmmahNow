name: Cleanup PR Preview Deployments

# Deletes the preview workers a PR's `deploy-preview` label created
# (deploy.yml: al-ummah-{web,api,processor,comms,admin-api,admin-web}-pr-<N>).
# Runs when a PR closes; by hand for older PRs. A preview that owns a custom
# domain is never deleted: deleting it would detach that hostname (on 2026-11-09
# a preview owned admin.api.alummahnow.net; the release re-attaches such domains).

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Comma-separated PR numbers to clean up (leave empty for every closed PR with a preview worker)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - only list workers without deleting'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-pr-previews
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs get no secrets and never had previews
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete preview workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr_numbers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          cf() { curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }

          scripts=$(cf "$api/workers/scripts" | jq -r '.result[].id')
          domains=$(cf "$api/workers/domains?per_page=500" | jq -r '.result[] | "\(.service) \(.hostname)"')
          previews=$(grep -E '^al-ummah-(web|api|processor|comms|admin-api|admin-web)-pr-[0-9]+$' <<<"$scripts" || true)

          if [ "$EVENT" = "pull_request" ]; then
            prs="$PR_NUMBER"
          elif [ -n "$PR_INPUT" ]; then
            prs=$(tr ',' ' ' <<<"$PR_INPUT")
          else
            # Every PR that still has a preview worker, if that PR is closed
            prs=""
            for n in $(sed -E 's/.*-pr-//' <<<"$previews" | sort -un); do
              [ "$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state)" != "OPEN" ] && prs="$prs $n"
            done
          fi
          echo "PRs: ${prs:-none}"

          failed=0
          for n in $prs; do
            for w in $(grep -E -- "-pr-${n}\$" <<<"$previews" || true); do
              owned=$(awk -v w="$w" '$1 == w { print $2 }' <<<"$domains")
              if [ -n "$owned" ]; then
                echo "::error::$w owns custom domain(s) $(tr "\n" " " <<<"$owned"); not deleting it (re-attach them to the right worker first)"
                failed=1
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then echo "[dry run] would delete $w"; continue; fi
              if cf -X DELETE "$api/workers/scripts/$w?force=true" | jq -e '.success' >/dev/null; then
                echo "deleted $w"
              else
                echo "::error::could not delete $w"
                failed=1
              fi
            done
          done
          exit $failed
