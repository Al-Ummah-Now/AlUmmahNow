name: Cleanup PR Preview Deployments

# Deletes PR preview Workers (any al-ummah `*-pr-<N>` Worker on the shared account).
# Only the web preview is still deployed (deploy.yml `deploy-preview` label, al-ummah-web-pr-<N>):
# the backend and admin previews were dropped on 2026-11-14 (nothing used them, admin-web's did not
# build, and on wrangler.qa.jsonc they tried to consume QA's queues and run QA's crons, run
# 43572945300). Any other `*-pr-<N>` Worker is a leftover and is deleted even while its PR is open;
# a web preview is deleted when its PR closes.
# Runs when a PR closes, daily (a close-time run that failed or predates this workflow left PR 466's
# six workers deployed for days), and by hand. A preview that owns a custom
# domain is never deleted: deleting it would detach that hostname (on 2026-11-09
# a preview owned admin.api.alummahnow.net; the release re-attaches such domains).

on:
  pull_request:
    types: [closed]
  schedule:
    - cron: '23 4 * * *'
  workflow_dispatch:
    inputs:
      pr_numbers:
        description: 'Comma-separated PR numbers to clean up (leave empty for every closed PR with a preview worker)'
        required: false
        type: string
      dry_run:
        description: 'Dry run - only list workers without deleting'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: cleanup-pr-previews
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    # Same-repo PRs only: fork PRs get no secrets and never had previews
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Delete preview workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_INPUT: ${{ inputs.pr_numbers }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          api="https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}"
          cf() { curl -sS -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" "$@"; }

          scripts=$(cf "$api/workers/scripts" | jq -r '.result[].id')
          domains=$(cf "$api/workers/domains?per_page=500" | jq -r '.result[] | "\(.service) \(.hostname)"')
          previews=$(grep -E '^al-ummah(-now)?-[a-z0-9-]+-pr-[0-9]+$' <<<"$scripts" || true)
          # Not deployed any more: deleted whatever their PR's state (only on the daily or manual sweep)
          leftovers=$(grep -vE '^al-ummah-web-pr-[0-9]+$' <<<"$previews" || true)

          if [ "$EVENT" = "pull_request" ]; then
            prs="$PR_NUMBER"
          elif [ -n "$PR_INPUT" ]; then
            prs=$(tr ',' ' ' <<<"$PR_INPUT")
          else
            # Every PR that still has a preview worker, if that PR is closed
            prs=""
            for n in $(sed -E 's/.*-pr-//' <<<"$previews" | sort -un); do
              [ "$(gh pr view "$n" -R "$GITHUB_REPOSITORY" --json state -q .state)" != "OPEN" ] && prs="$prs $n"
            done
          fi
          echo "PRs: ${prs:-none}"

          targets=""
          for n in $prs; do targets="$targets $(grep -E -- "-pr-${n}\$" <<<"$previews" | tr '\n' ' ' || true)"; done
          if [ "$EVENT" != "pull_request" ] && [ -z "$PR_INPUT" ]; then targets="$targets $(tr '\n' ' ' <<<"$leftovers")"; fi
          targets=$(tr ' ' '\n' <<<"$targets" | grep -v '^$' | sort -u || true)
          echo "Workers: $(tr '\n' ' ' <<<"${targets:-none}")"

          failed=0
          for w in $targets; do
              owned=$(awk -v w="$w" '$1 == w { print $2 }' <<<"$domains")
              if [ -n "$owned" ]; then
                echo "::error::$w owns custom domain(s) $(tr "\n" " " <<<"$owned"); not deleting it (re-attach them to the right worker first)"
                failed=1
                continue
              fi
              if [ "$DRY_RUN" = "true" ]; then echo "[dry run] would delete $w"; continue; fi
              if cf -X DELETE "$api/workers/scripts/$w?force=true" | jq -e '.success' >/dev/null; then
                echo "deleted $w"
              else
                echo "::error::could not delete $w"
                failed=1
              fi
          done
          exit $failed
