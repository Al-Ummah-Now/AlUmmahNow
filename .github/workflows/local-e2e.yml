name: Local E2E

# E2E specs placed `local` (apps/web/e2e/test-utils/placement.ts; table: scripts/e2e/placement-doc.ts)
# run here, on a local stack each job boots for itself (docs/testing/LOCAL-STACK.md): this PR's
# code, the Auth repo's last released bundle, fakes for Bunny/images/Resend, mocked AI, seeded data.
# No QA, no shared data, no locks: every job is isolated, so the matrix runs fully in parallel.
# The deployed specs keep running against QA/stage (release-e2e.yml); see the placement table in the build job's summary.

# The Auth repo comes as its released local-stack bundle (scripts/local-stack/fetch-auth.ts),
# never as a checkout, so these jobs may also run in default-branch contexts (push, schedule, tags)
# without CodeQL's cache-poisoning finding; those triggers come once batch 1 is green.
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/local-stack/**'
      - '.github/actions/local-stack-up/**'
      - '.github/workflows/local-e2e.yml'
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.release.config.ts'

permissions:
  contents: read
  packages: read

concurrency:
  group: local-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Placement table
        run: node --experimental-strip-types --no-warnings scripts/e2e/placement-doc.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
          pnpm --filter @al-ummah/web build
          (cd apps/web && pnpm opennextjs-cloudflare build)
          pnpm --filter @al-ummah/admin-web build
          (cd apps/admin-web && pnpm opennextjs-cloudflare build)

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-build
          path: |
            packages/*/dist
            apps/web/.open-next
            apps/admin-web/.open-next
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

  release:
    name: Local release suite - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Run mode: every account is e2e+<run>-…, every builder name starts with the run id, so the
      # leftover check can find whatever the run did not remove (each job has its own stack)
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-flows 1/3, project: auth-flows, shard: 1/3, browsers: chromium }
          - { name: auth-flows 2/3, project: auth-flows, shard: 2/3, browsers: chromium }
          - { name: auth-flows 3/3, project: auth-flows, shard: 3/3, browsers: chromium }
          - { name: player, project: player, shard: 1/1, browsers: chrome }
          - { name: chrome, project: chrome, shard: 1/1, browsers: chrome }
          - { name: firefox, project: firefox, shard: 1/1, browsers: firefox }
          - { name: webkit, project: webkit, shard: 1/1, browsers: webkit }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack-up
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/playwright-install
        with:
          browsers: ${{ matrix.browsers }}
          working-directory: apps/web

      # Diagnostic while WebKit's load event never fires on the stack: what is it still waiting on
      - name: Pending requests (WebKit)
        if: matrix.project == 'webkit'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/local-stack/pending-requests.mjs webkit http://localhost:3001/en

      - name: Run
        working-directory: apps/web
        run: |
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"
          echo "E2E_RUN_USER_IDS_FILE=$RUNNER_TEMP/run-user-ids.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USERS_FILE="$RUNNER_TEMP/run-users.txt" E2E_RUN_USER_IDS_FILE="$RUNNER_TEMP/run-user-ids.txt"
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          pnpm exec playwright test -c playwright.release.config.ts --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          CI: 'true'
          E2E_ENV: local
          # The stack listens on 127.0.0.1: never let Node try ::1 for "localhost" first
          NODE_OPTIONS: --dns-result-order=ipv4first
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      # The run's accounts, as on QA (auth soft delete + immediate purge through the test route)
      - name: Delete the run accounts
        if: always()
        run: |
          if [ ! -s "${E2E_RUN_USERS_FILE:-}" ]; then echo "No run accounts were generated"; exit 0; fi
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts --auth-url http://localhost:3301 --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      # Nothing the run created may be left (owner rule). Report-only until every spec of the batch
      # cleans up fully; then this gates.
      - name: Leftovers
        if: always()
        run: node --experimental-strip-types --no-warnings scripts/local-stack/leftovers.ts --marker "$E2E_RUN_ID" --report-only

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-${{ strategy.job-index }}
          path: |
            apps/web/release-report
            apps/web/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore
