name: Local E2E

# E2E specs placed `local` (apps/web/e2e/test-utils/placement.ts, docs/testing/E2E-PLACEMENT.md)
# run here, on a local stack each job boots for itself (docs/testing/LOCAL-STACK.md): this PR's
# code, the Auth repo at its last release, fakes for Bunny/images/Resend, mocked AI, seeded data.
# No QA, no shared data, no locks: every job is isolated, so the matrix runs fully in parallel.
# The deployed specs keep running against QA/stage (release-e2e.yml); see E2E-PLACEMENT.md.

# Until each batch is green it runs only for changes to the harness or the suites; step 4 of the
# move (docs/testing/E2E-PLACEMENT.md) makes it run on every pull request. Pull requests only: the
# jobs check out a second repo (Auth), and in a default-branch context every later step could
# poison caches the default branch trusts (CodeQL actions/cache-poisoning).
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/local-stack/**'
      - '.github/actions/local-stack-up/**'
      - '.github/workflows/local-e2e.yml'
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.release.config.ts'

permissions:
  contents: read
  packages: read

concurrency:
  group: local-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      auth_sha: ${{ steps.refs.outputs.auth_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Released refs of the sibling repos
        id: refs
        run: node --experimental-strip-types --no-warnings scripts/local-stack/resolve-refs.ts auth | tee -a "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Check out the Auth repo at its last release
        uses: actions/checkout@v4
        with:
          repository: Al-Ummah-Now/AlUmmahNowAuth
          ref: ${{ steps.refs.outputs.auth_sha }}
          path: .local-stack/repos/auth
          persist-credentials: false

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      # No dependency cache: a second repo is checked out (CodeQL actions/cache-poisoning)
      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Install
        run: |
          pnpm install --frozen-lockfile
          cd .local-stack/repos/auth
          echo "@al-ummah-now:registry=https://npm.pkg.github.com" >> .npmrc
          echo "//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}" >> .npmrc
          pnpm install --frozen-lockfile
          (cd apps/admin && pnpm build)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
          pnpm --filter @al-ummah/web build
          (cd apps/web && pnpm opennextjs-cloudflare build)
          pnpm --filter @al-ummah/admin-web build
          (cd apps/admin-web && pnpm opennextjs-cloudflare build)

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-build
          path: |
            packages/*/dist
            apps/web/.open-next
            apps/admin-web/.open-next
            .local-stack/repos/auth/apps/admin/build
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

  release:
    name: Local release suite - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-flows 1/3, project: auth-flows, shard: 1/3, browsers: chromium }
          - { name: auth-flows 2/3, project: auth-flows, shard: 2/3, browsers: chromium }
          - { name: auth-flows 3/3, project: auth-flows, shard: 3/3, browsers: chromium }
          - { name: player, project: player, shard: 1/1, browsers: chrome }
          - { name: chrome, project: chrome, shard: 1/1, browsers: chrome }
          - { name: firefox, project: firefox, shard: 1/1, browsers: firefox }
          - { name: webkit, project: webkit, shard: 1/1, browsers: webkit }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack-up
        with:
          auth-sha: ${{ needs.build.outputs.auth_sha }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/playwright-install
        with:
          browsers: ${{ matrix.browsers }}
          working-directory: apps/web

      - name: Run
        working-directory: apps/web
        run: |
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          pnpm exec playwright test -c playwright.release.config.ts --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          CI: 'true'
          E2E_ENV: local
          # The stack listens on 127.0.0.1: never let Node try ::1 for "localhost" first
          NODE_OPTIONS: --dns-result-order=ipv4first
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-${{ strategy.job-index }}
          path: |
            apps/web/release-report
            apps/web/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore
