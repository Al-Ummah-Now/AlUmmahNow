name: Local E2E

# E2E specs placed `local` (apps/web/e2e/test-utils/placement.ts; table: scripts/e2e/placement-doc.ts)
# run here, on a local stack each job boots for itself (docs/testing/LOCAL-STACK.md): this PR's
# code, the Auth repo's last released bundle, fakes for Bunny/images/Resend, mocked AI, seeded data.
# No QA, no shared data, no locks: every job is isolated, so the matrix runs fully in parallel.
# The deployed specs keep running against QA/stage (release-e2e.yml); see the placement table in the build job's summary.

# The Auth repo comes as its released local-stack bundle (scripts/local-stack/fetch-auth.ts),
# never as a checkout, so these jobs run in default-branch contexts (push, schedule, release) too
# without CodeQL's cache-poisoning finding.
# Every pull request (local E2E is the PR suite: fast, isolated, no QA), every push to main and
# nightly, so main always has its own result; release.yml calls it for every release tag, and
# production waits for it next to the deployed suite on stage (release-e2e.yml).
on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
  push:
    branches: [main]
  schedule:
    - cron: '45 3 * * *'
  workflow_dispatch:
    inputs:
      update_visual:
        description: 'Regenerate the web visual snapshot baselines (apps/web/e2e/visual) and upload them as an artifact to commit'
        type: boolean
        default: false
  workflow_call:

permissions:
  contents: read
  packages: read

concurrency:
  group: local-e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    name: Build local stack
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 9.15.4

      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Placement table
        run: node --experimental-strip-types --no-warnings scripts/e2e/placement-doc.ts >> "$GITHUB_STEP_SUMMARY"

      - name: Build
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build
          pnpm --filter @al-ummah/web build
          (cd apps/web && pnpm opennextjs-cloudflare build)
          pnpm --filter @al-ummah/admin-web build
          (cd apps/admin-web && pnpm opennextjs-cloudflare build)

      - name: Upload builds
        uses: actions/upload-artifact@v4
        with:
          name: local-stack-build
          path: |
            packages/*/dist
            apps/web/.open-next
            apps/admin-web/.open-next
          include-hidden-files: true
          retention-days: 2
          if-no-files-found: error

  release:
    name: Local release suite - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      # Run mode: every account is e2e+<run>-…, every builder name starts with the run id, so the
      # leftover check can find whatever the run did not remove (each job has its own stack)
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: auth-flows 1/3, project: auth-flows, shard: 1/3, browsers: chromium }
          - { name: auth-flows 2/3, project: auth-flows, shard: 2/3, browsers: chromium }
          - { name: auth-flows 3/3, project: auth-flows, shard: 3/3, browsers: chromium }
          - { name: player, project: player, shard: 1/1, browsers: chrome }
          - { name: chrome, project: chrome, shard: 1/1, browsers: chrome }
          - { name: firefox, project: firefox, shard: 1/1, browsers: firefox }
          - { name: webkit, project: webkit, shard: 1/1, browsers: webkit }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack-up
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/playwright-install
        with:
          browsers: ${{ matrix.browsers }}
          working-directory: apps/web

      # Diagnostic while WebKit's load event never fires on the stack: what is it still waiting on
      - name: Pending requests (WebKit)
        if: matrix.project == 'webkit'
        continue-on-error: true
        timeout-minutes: 3
        run: node scripts/local-stack/pending-requests.mjs webkit http://localhost:3001/en

      - name: Run
        working-directory: apps/web
        run: |
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"
          echo "E2E_RUN_USER_IDS_FILE=$RUNNER_TEMP/run-user-ids.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USERS_FILE="$RUNNER_TEMP/run-users.txt" E2E_RUN_USER_IDS_FILE="$RUNNER_TEMP/run-user-ids.txt"
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          pnpm exec playwright test -c playwright.release.config.ts --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          CI: 'true'
          E2E_ENV: local
          # The stack listens on 127.0.0.1: never let Node try ::1 for "localhost" first
          NODE_OPTIONS: --dns-result-order=ipv4first
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      # What ran, pass or fail (as the web suite, #1089): skipped tests and their reasons in the job
      # summary, and every test's status as an artifact
      - name: Test outcomes
        if: always()
        working-directory: apps/web
        run: |
          if [ ! -f test-results/test-results.json ]; then echo "no results file"; exit 0; fi
          node --experimental-strip-types --no-warnings ../../scripts/ci/playwright-outcomes.ts test-results/test-results.json "Release suite ${{ matrix.name }}" --list > "$RUNNER_TEMP/outcomes.txt"
          grep -v $'\t' "$RUNNER_TEMP/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          grep $'\t' "$RUNNER_TEMP/outcomes.txt" > test-results/outcomes.tsv || true
          echo "passed: $(grep -c $'^passed\t' test-results/outcomes.tsv || true)"; grep $'^skipped\t' test-results/outcomes.tsv || true

      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-outcomes-${{ strategy.job-index }}
          path: |
            apps/web/test-results/test-results.json
            apps/web/test-results/outcomes.tsv
          if-no-files-found: ignore
          retention-days: 14

      # The run's accounts, as on QA (auth soft delete + immediate purge through the test route)
      - name: Delete the run accounts
        if: always()
        run: |
          if [ ! -s "${E2E_RUN_USERS_FILE:-}" ]; then echo "No run accounts were generated"; exit 0; fi
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts --auth-url http://localhost:3301 --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      # Nothing the run created may be left (owner rule). Report-only until every spec of the batch
      # cleans up fully; then this gates.
      - name: Leftovers
        if: always()
        run: node --experimental-strip-types --no-warnings scripts/local-stack/leftovers.ts --marker "$E2E_RUN_ID" --report-only

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-release-${{ strategy.job-index }}
          path: |
            apps/web/release-report
            apps/web/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore

  # The admin suite (apps/admin-web/e2e): every account it signs in with (admin, moderator, super
  # admin, viewer) is this job's own, its role granted in the stack's database (global-setup.ts);
  # specs create and delete their data and the global teardown erases the accounts
  # (support/cleanup.ts), so the leftover check gates here.
  admin:
    name: Local admin suite - ${{ matrix.name }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: chromium 1/2, project: chromium, shard: 1/2, browsers: chromium }
          - { name: chromium 2/2, project: chromium, shard: 2/2, browsers: chromium }
          - { name: webkit, project: webkit, shard: 1/1, browsers: chromium webkit }
          - { name: mobile, project: mobile, shard: 1/1, browsers: chromium }
          - { name: shared-state, project: shared-state, shard: 1/1, browsers: chromium }
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack-up
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      # Global setup always signs in with Chromium; WebKit only for its project
      - uses: ./.github/actions/playwright-install
        with:
          browsers: ${{ matrix.browsers }}
          working-directory: apps/admin-web

      # Diagnostic for #1020: what a WebKit page load on admin-web and on the issuer's sign-in waits on
      - name: Pending requests (WebKit)
        if: matrix.project == 'webkit'
        continue-on-error: true
        timeout-minutes: 4
        run: |
          node scripts/local-stack/pending-requests.mjs webkit http://localhost:3091/login
          node scripts/local-stack/pending-requests.mjs webkit http://localhost:3091/access-denied

      - name: Run
        working-directory: apps/admin-web
        run: |
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"
          echo "E2E_RUN_USER_IDS_FILE=$RUNNER_TEMP/run-user-ids.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USERS_FILE="$RUNNER_TEMP/run-users.txt" E2E_RUN_USER_IDS_FILE="$RUNNER_TEMP/run-user-ids.txt"
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          E2E_RUN_USER_PASSWORD="Adm-$(openssl rand -base64 18 | tr '+/' '-_' | tr -d '=')-1!"
          echo "::add-mask::$E2E_RUN_USER_PASSWORD"
          export E2E_RUN_USER_PASSWORD
          pnpm exec playwright test --project="${{ matrix.project }}" --shard="${{ matrix.shard }}"
        env:
          CI: 'true'
          E2E_ENV: local
          E2E_ADMIN_PROJECT: ${{ matrix.project }}
          NODE_OPTIONS: --dns-result-order=ipv4first
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret
          INTERNAL_API_KEY: local-stack-internal-key

      # The global teardown already erased and deleted them; this is the safety net if it crashed
      - name: Delete the run accounts
        if: always()
        run: |
          if [ ! -s "${E2E_RUN_USERS_FILE:-}" ]; then echo "No run accounts were generated"; exit 0; fi
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts --auth-url http://localhost:3301 --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      # Owner rule: nothing the job created may be left on its stack. This gates. Allowed: revocations
      # (auth user_revocations, TOKEN_REVOCATIONS u:<id>), kept on purpose to outlive the tokens; they
      # hold the user id only, never the email (AlUmmahNowAuth#326). And the queue processor's message
      # archive (r2 al-ummah-now-messages): history the product keeps by design, not data the specs
      # made (#1111)
      - name: Leftovers
        if: always()
        run: >-
          node --experimental-strip-types --no-warnings scripts/local-stack/leftovers.ts --marker "$E2E_RUN_ID"
          --allow d1:al-ummah-now-d1:user_revocations --allow kv:TOKEN_REVOCATIONS --allow r2:al-ummah-now-messages

      # Teardown, pass or fail (owner rule: test sets clean up every resource they use): the run
      # accounts' content goes (videos with their media, then the GDPR erase of profile, channels,
      # playlists, history), then the accounts themselves on the local issuer
      - name: Erase the run accounts' content
        if: always()
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          if [ ! -s "$E2E_RUN_USERS_FILE" ]; then echo "No run accounts were generated"; exit 0; fi
          pnpm exec tsx e2e/cleanup-test-content.ts --run-users
        env:
          E2E_ENV: local
          E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          E2E_RUN_USERS_FILE: ${{ runner.temp }}/run-users.txt
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          OPENAUTH_URL: http://localhost:3301
          WEB_APP_URL: http://localhost:3001
          API_URL: http://localhost:3086
          OPENAUTH_CLIENT_ID: f0de3c30-0304-4ac4-86d6-1e185dec0439

      - name: Delete the run accounts
        if: always()
        timeout-minutes: 5
        run: >-
          if [ ! -s "$E2E_RUN_USERS_FILE" ]; then echo "No run accounts were generated"; exit 0; fi;
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts
          --auth-url http://localhost:3301 --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_RUN_USERS_FILE: ${{ runner.temp }}/run-users.txt
          E2E_CODE_SINK_SECRET: local-stack-sink-secret
          TEST_PROMOTE_SECRET: local-stack-promote-secret

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-admin-${{ strategy.job-index }}
          path: |
            apps/admin-web/playwright-report
            apps/admin-web/test-results
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore

  # The web suite (apps/web/playwright.config.ts), 5 shards: the specs moved to the local stack so
  # far (e2e/test-utils/local-web-specs.ts; e2e-tests.yml no longer runs them against QA). Global
  # setup registers this shard's own accounts on the local issuer; the specs make their own
  # channels and videos (release/builders.ts) and delete them. Each shard boots and seeds its own
  # stack, erases and deletes its run accounts, then checks that nothing of the run is left.
  web:
    name: Local web suite - ${{ matrix.shard }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      # Run mode: every account is e2e+<run>-…, every name the specs make carries the run id, so
      # the leftover check can find whatever the run did not remove (each job has its own stack)
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_ENV: local
      E2E_CODE_SINK_SECRET: local-stack-sink-secret
      TEST_PROMOTE_SECRET: local-stack-promote-secret
      OPENAUTH_URL: http://localhost:3301
      WEB_APP_URL: http://localhost:3001
      API_URL: http://localhost:3086
      OPENAUTH_CLIENT_ID: f0de3c30-0304-4ac4-86d6-1e185dec0439
      # The stack listens on 127.0.0.1: never let Node try ::1 for "localhost" first
      NODE_OPTIONS: --dns-result-order=ipv4first
    strategy:
      fail-fast: false
      matrix:
        shard: [1/5, 2/5, 3/5, 4/5, 5/5]
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/local-stack-up
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Run
        working-directory: apps/web
        run: |
          echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"
          echo "E2E_RUN_USER_IDS_FILE=$RUNNER_TEMP/run-user-ids.txt" >> "$GITHUB_ENV"
          export E2E_RUN_USERS_FILE="$RUNNER_TEMP/run-users.txt" E2E_RUN_USER_IDS_FILE="$RUNNER_TEMP/run-user-ids.txt"
          # The run accounts' password: random per job (the stack dies with it), shared with the teardown
          E2E_USER_PASSWORD="Aa1!$(openssl rand -hex 16)"
          echo "::add-mask::$E2E_USER_PASSWORD"
          echo "E2E_USER_PASSWORD=$E2E_USER_PASSWORD" >> "$GITHUB_ENV"
          export E2E_USER_PASSWORD
          # The PR's own code runs here: none of the "not deployed on QA yet" pull-request skips apply
          export GITHUB_EVENT_NAME=local-stack
          # Global setup's accounts: e2e+<run>-<attempt>-web-local-<shard>-<role>
          export E2E_PROJECT="local-${SHARD%%/*}"
          code=0
          # Visual baselines are made here (Linux, the stack's own data): workflow_dispatch update_visual=true
          update=()
          if [ "${UPDATE_VISUAL:-}" = "true" ]; then update=(--update-snapshots=all); fi
          pnpm exec playwright test --project=chromium --project=shared-state --project=a11y --project=visual --shard="$SHARD" "${update[@]}" || code=$?
          # A shard that ran nothing is a broken split, never a pass (Playwright exits 0 on an empty shard)
          ran=$(node -e 'const s=require("./test-results/test-results.json").stats||{};console.log((s.expected||0)+(s.unexpected||0)+(s.flaky||0))' 2>/dev/null || echo 0)
          echo "Shard $SHARD ran $ran test(s)"
          if [ "$ran" -eq 0 ]; then echo "::error::shard $SHARD ran no tests"; exit 1; fi
          exit "$code"
        env:
          CI: 'true'
          SHARD: ${{ matrix.shard }}
          UPDATE_VISUAL: ${{ github.event_name == 'workflow_dispatch' && inputs.update_visual }}
          E2E_WORKERS: '2'
          # The shard's own stack: see every failure, not the first five (QA runs keep the cap)
          E2E_MAX_FAILURES: '1000'

      # What ran, pass or fail: a green shard still shows every skipped test and why (a skip is not a
      # pass), and keeps its per-test results (names + status) as an artifact
      - name: Test outcomes
        if: always()
        working-directory: apps/web
        run: |
          if [ ! -f test-results/test-results.json ]; then echo "no results file"; exit 0; fi
          node --experimental-strip-types --no-warnings ../../scripts/ci/playwright-outcomes.ts test-results/test-results.json "Web shard ${{ matrix.shard }}" --list > "$RUNNER_TEMP/outcomes.txt"
          grep -v $'\t' "$RUNNER_TEMP/outcomes.txt" >> "$GITHUB_STEP_SUMMARY"
          grep $'\t' "$RUNNER_TEMP/outcomes.txt" > test-results/outcomes.tsv || true
          echo "passed: $(grep -c $'^passed\t' test-results/outcomes.tsv || true)"; grep $'^skipped\t' test-results/outcomes.tsv || true

      - name: Upload test outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-web-outcomes-${{ strategy.job-index }}
          path: |
            apps/web/test-results/test-results.json
            apps/web/test-results/outcomes.tsv
          if-no-files-found: ignore
          retention-days: 14

      # Teardown, pass or fail (owner rule: test sets clean up every resource they use): the run
      # accounts' content goes (videos with their media, then the GDPR erase of profile, channels,
      # playlists, history), then the accounts themselves on the local issuer
      - name: Erase the run accounts' content
        if: always()
        timeout-minutes: 10
        working-directory: apps/web
        run: |
          if [ ! -s "${E2E_RUN_USERS_FILE:-}" ]; then echo "No run accounts were generated"; exit 0; fi
          pnpm exec tsx e2e/cleanup-test-content.ts --run-users

      - name: Delete the run accounts
        if: always()
        timeout-minutes: 5
        run: |
          if [ ! -s "${E2E_RUN_USERS_FILE:-}" ]; then echo "No run accounts were generated"; exit 0; fi
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts --auth-url http://localhost:3301 --file "$E2E_RUN_USERS_FILE"

      # Nothing the run created may be left (owner rule). Report-only until every moved spec cleans
      # up fully; then this gates.
      - name: Leftovers
        if: always()
        run: node --experimental-strip-types --no-warnings scripts/local-stack/leftovers.ts --marker "$E2E_RUN_ID" --report-only

      - name: Stack log
        if: always()
        run: |
          if [ -n "${STACK_PID:-}" ] && kill -0 "$STACK_PID" 2>/dev/null; then kill "$STACK_PID"; fi
          grep -h "refused" "$RUNNER_TEMP/stack.log" | sort | uniq -c | sort -rn | head -30 || true

      - name: Upload visual baselines
        if: always() && github.event_name == 'workflow_dispatch' && inputs.update_visual
        uses: actions/upload-artifact@v4
        with:
          name: visual-baselines-${{ strategy.job-index }}
          path: apps/web/e2e/visual/__screenshots__
          retention-days: 7
          if-no-files-found: ignore

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: local-web-${{ strategy.job-index }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
            apps/web/e2e/.auth/error-*.png
            ${{ runner.temp }}/stack.log
          retention-days: 7
          if-no-files-found: ignore
