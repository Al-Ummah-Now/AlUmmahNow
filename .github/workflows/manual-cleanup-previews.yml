name: Manual Cleanup Preview Workers

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "DELETE" to confirm deletion of all orphaned preview workers'
        required: true
        type: string

jobs:
  cleanup-orphaned-previews:
    runs-on: ubuntu-latest
    if: github.event.inputs.confirm == 'DELETE'

    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}

    steps:
      - name: Delete workers using Cloudflare API
        run: |
          # Function to delete a worker
          delete_worker() {
            local worker_name=$1
            echo "Deleting $worker_name..."

            response=$(curl -s -w "\n%{http_code}" -X DELETE \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name" \
              -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              -H "Content-Type: application/json")

            http_code=$(echo "$response" | tail -n1)
            body=$(echo "$response" | sed '$d')

            if [ "$http_code" = "200" ]; then
              echo "✓ Successfully deleted $worker_name"
              return 0
            elif echo "$body" | grep -q "10007"; then
              echo "⊘ $worker_name does not exist (already deleted)"
              return 0
            elif echo "$body" | grep -q "10064"; then
              echo "✗ $worker_name is bound to a queue - requires unbinding first"
              return 1
            else
              echo "✗ Failed to delete $worker_name (HTTP $http_code)"
              echo "Response: $body"
              return 1
            fi
          }

          echo "========================================"
          echo "Deleting Orphaned Preview Workers"
          echo "========================================"
          echo ""

          # PR #72 workers
          echo "--- PR #72 Workers ---"
          delete_worker "al-ummah-processor-pr-72"
          delete_worker "al-ummah-comms-pr-72"
          echo ""

          # PR #44 workers
          echo "--- PR #44 Workers ---"
          delete_worker "al-ummah-web-pr-44"
          delete_worker "al-ummah-api-pr-44"
          delete_worker "al-ummah-processor-pr-44"
          delete_worker "al-ummah-comms-pr-44"
          echo ""

          # PR #43 workers
          echo "--- PR #43 Workers ---"
          delete_worker "al-ummah-web-pr-43"
          delete_worker "al-ummah-api-pr-43"
          delete_worker "al-ummah-processor-pr-43"
          delete_worker "al-ummah-comms-pr-43"
          echo ""

          # PR #42 workers
          echo "--- PR #42 Workers ---"
          delete_worker "al-ummah-web-pr-42"
          delete_worker "al-ummah-api-pr-42"
          delete_worker "al-ummah-processor-pr-42"
          echo ""

          # Auth workers (different repo)
          echo "--- Auth Workers (Different Repo) ---"
          echo "The following auth workers belong to al-ummah-now-auth repo:"
          echo ""
          echo "PR #48:"
          delete_worker "al-ummah-now-auth-admin-pr-48"
          delete_worker "al-ummah-now-profile-pr-48"
          delete_worker "al-ummah-now-auth-pr-48"
          echo ""
          echo "PR #28:"
          delete_worker "al-ummah-now-auth-admin-pr-28"
          delete_worker "al-ummah-now-auth-pr-28"
          delete_worker "al-ummah-now-profile-pr-28"
          echo ""
          echo "PR #27:"
          delete_worker "al-ummah-now-auth-admin-pr-27"
          delete_worker "al-ummah-now-auth-pr-27"
          delete_worker "al-ummah-now-profile-pr-27"
          echo ""
          echo "PR #26:"
          delete_worker "al-ummah-now-auth-admin-pr-26"
          delete_worker "al-ummah-now-auth-pr-26"
          delete_worker "al-ummah-now-profile-pr-26"
          echo ""

          echo "========================================"
          echo "Cleanup Complete!"
          echo "========================================"
          echo ""
          echo "If any workers failed due to queue bindings,"
          echo "they must be unbound first via the Cloudflare dashboard:"
          echo "https://dash.cloudflare.com/$CLOUDFLARE_ACCOUNT_ID/workers-and-pages"
