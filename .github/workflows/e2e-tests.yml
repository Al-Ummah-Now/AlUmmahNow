name: E2E Tests

on:
  pull_request:
    branches: [main, 'integrate/**']
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  # Centralized auth setup - runs once, shares auth state with all test jobs
  auth-setup:
    name: Auth Setup
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright (chromium only for auth)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Create auth directory
        working-directory: apps/web
        run: mkdir -p e2e/.auth

      - name: Run auth setup
        working-directory: apps/web
        run: npx tsx e2e/run-auth-setup.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAUTH_URL: https://auth.qa.alummahnow.net
          WEB_APP_URL: https://videos.qa.alummahnow.net

      - name: Debug - List auth files
        run: |
          echo "Current directory: $(pwd)"
          echo "Contents of apps/web/e2e/.auth/:"
          ls -la apps/web/e2e/.auth/ || echo "Directory not found"
          echo "Full path check:"
          ls -la ${{ github.workspace }}/apps/web/e2e/.auth/ || echo "Full path directory not found"

      - name: Upload auth state
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  e2e-tests:
    name: E2E Tests - Video Upload
    needs: auth-setup
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        # Always install chromium (needed by globalSetup) plus matrix browser
        run: pnpm exec playwright install --with-deps chromium ${{ matrix.browser }}

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Run E2E tests
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.browser }} e2e/*video-upload*.spec.ts
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAUTH_URL: https://auth.qa.alummahnow.net
          WEB_APP_URL: https://videos.qa.alummahnow.net

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.browser }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload test videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-videos-${{ matrix.browser }}
          path: apps/web/test-results/
          retention-days: 7

  e2e-tests-full:
    name: Full E2E Test Suite
    needs: auth-setup
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Run all E2E tests
        working-directory: apps/web
        run: pnpm exec playwright test
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAUTH_URL: https://auth.qa.alummahnow.net
          WEB_APP_URL: https://videos.qa.alummahnow.net

      - name: Generate HTML report
        if: always()
        working-directory: apps/web
        run: pnpm exec playwright show-report --host 0.0.0.0

      - name: Upload full test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-full
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: junit-report
          path: apps/web/test-results/junit.xml
          retention-days: 30

      - name: Publish test results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: apps/web/test-results/junit.xml
          check_name: E2E Test Results

  e2e-mobile:
    name: Mobile E2E Tests
    needs: auth-setup
    runs-on: ubuntu-24.04  # Playwright has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        device: ['Pixel 5', 'iPhone 12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium webkit

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Run mobile E2E tests
        working-directory: apps/web
        run: |
          if [[ "${{ matrix.device }}" == "Pixel 5" ]]; then
            pnpm exec playwright test --project="Mobile Chrome"
          else
            pnpm exec playwright test --project="Mobile Safari"
          fi
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          OPENAUTH_URL: https://auth.qa.alummahnow.net
          WEB_APP_URL: https://videos.qa.alummahnow.net

      - name: Upload mobile test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-test-results-${{ matrix.device }}
          path: apps/web/test-results/
          retention-days: 7
