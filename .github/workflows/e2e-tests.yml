name: E2E Tests

# Legacy multi-browser suite against QA. Every run is real traffic on the QA
# workers (and Workers Logs lines), and a full matrix run takes ~1h40m, so:
#   - pull requests run the chromium project only (the release suite in
#     release-e2e.yml also runs on every PR into main);
#   - the full matrix (firefox, webkit, mobile, a11y, visual, Lighthouse) runs
#     nightly, after a Release run, and on demand (workflow_dispatch).
on:
  pull_request:
    branches: [main, 'integrate/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '30 2 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the visual snapshot baselines (Linux) and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  checks: write  # EnricoMi/publish-unit-test-result-action creates the JUnit check runs

env:
  OPENAUTH_URL: https://auth.qa.alummahnow.net
  WEB_APP_URL: https://videos.qa.alummahnow.net
  API_URL: https://videos.api.qa.alummahnow.net
  OPENAUTH_CLIENT_ID: e0de3c30-0304-4ac4-86d6-1e185dec0439

jobs:
  # Every UI spec on every browser/device project. One job per project, each
  # with its own pinned QA users (E2E_USERS_TIMESTAMP): the specs mutate their
  # users' channels, subscriptions and videos, so jobs running in parallel must
  # never share accounts. Users are registered on first use and reused after.
  #
  # The pinned users are global, not per run, so runs from different PRs or
  # branches would share them too (one run's temp channels and setting changes
  # then broke the other's specs). The job-level concurrency group queues a
  # project's job until the previous run's job on the same users has finished.
  # GitHub keeps one pending job per group: a newer queued run replaces an
  # older one that has not started yet. A running job is never cancelled, as
  # that would stop specs halfway through changing (and restoring) shared data.
  e2e:
    name: E2E - ${{ matrix.project }}
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    concurrency:
      group: e2e-qa-users-${{ matrix.users }}
      cancel-in-progress: false

    # Pull requests: chromium only. Everything else: the full matrix.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"project":"chromium","users":"1795000000001"}]' || '[{"project":"chromium","users":"1795000000001"},{"project":"firefox","users":"1795000000002"},{"project":"webkit","users":"1795000000003"},{"project":"Mobile Chrome","users":"1795000000004"},{"project":"Mobile Safari","users":"1795000000005"}]') }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        # chromium is always needed (auth setup fallback); webkit serves Mobile Safari
        run: |
          case "${{ matrix.project }}" in
            firefox) B=firefox ;;
            webkit|'Mobile Safari') B=webkit ;;
            *) B= ;;
          esac
          pnpm exec playwright install --with-deps chromium $B

      - name: Record E2E start
        id: e2e-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Run E2E specs
        working-directory: apps/web
        run: pnpm exec playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          E2E_USERS_TIMESTAMP: ${{ matrix.users }}
          E2E_GLOBAL_TIMEOUT_MINUTES: '100'
          E2E_MAX_FAILURES: '40'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      # QA videos-queue writes/min and DLQ writes during this run (all QA traffic in
      # the window, not only this job). Informational for now: it does not fail the job.
      - name: Queue budget (QA)
        if: always() && steps.e2e-start.outputs.at
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/release/queue-budget.ts --env qa --since "${{ steps.e2e-start.outputs.at }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Artifact name
        if: always()
        id: art
        shell: bash
        run: echo "name=$(echo '${{ matrix.project }}' | tr ' ' '-')" >> $GITHUB_OUTPUT

      # Artifacts of this public repo are downloadable by anyone signed in to
      # GitHub: drop any output that holds a secret or a storage state, then fail.
      - name: Scan test output for secrets
        if: always()
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          python3 scripts/ci/scan-artifacts-for-secrets.py
          --env E2E_CODE_SINK_SECRET --env E2E_USER_PASSWORD --env CLOUDFLARE_API_TOKEN
          --remove apps/web/playwright-report apps/web/test-results

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.art.outputs.name }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.art.outputs.name }}
          path: apps/web/test-results/
          retention-days: 14

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: apps/web/test-results/junit.xml
          check_name: E2E Results (${{ matrix.project }})
          comment_mode: off

  # axe-core WCAG 2.1 AA on every page, en/ar x light/dark (project "a11y")
  # and visual snapshots of key pages (project "visual").
  # Each job registers its own users in Playwright's global setup: storage
  # state (live QA session cookies) is never passed between jobs as an
  # artifact, since anyone signed in to GitHub can download artifacts here.
  dedicated:
    name: E2E - ${{ matrix.project }}
    if: ${{ github.event_name != 'pull_request' && !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        project: [a11y, visual]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Run ${{ matrix.project }} project
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: true
          E2E_MAX_FAILURES: '0'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Scan test output for secrets
        if: always()
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
        run: >-
          python3 scripts/ci/scan-artifacts-for-secrets.py
          --env E2E_CODE_SINK_SECRET --env E2E_USER_PASSWORD
          --remove apps/web/playwright-report apps/web/test-results

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

  # workflow_dispatch with update_snapshots=true: regenerate the Linux
  # baselines in e2e/visual/__screenshots__ and commit them to the branch.
  update-visual-snapshots:
    name: Update visual snapshots
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Regenerate snapshots
        working-directory: apps/web
        run: pnpm exec playwright test --project=visual --update-snapshots=all
        env:
          CI: true
          E2E_MAX_FAILURES: '0'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
          else
            git commit -m "test(e2e): update visual snapshots (Linux)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  # Lighthouse CI budgets for home, watch, channel and search on QA.
  # Non-blocking for now: assertions are warnings and the job may fail.
  lighthouse:
    name: Lighthouse (QA)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve QA seed URLs
        shell: bash
        run: |
          VIDEO=$(curl -fsS "$API_URL/api/videos?limit=100" | jq -r '[.data[] | select(.title | startswith("QA Lecture"))][0].id // empty')
          CHANNEL=$(curl -fsS "$API_URL/api/channels?limit=200" | jq -r '[.data[] | select(.name | startswith("Al Ummah Now QA"))][0].id // empty')
          echo "LHCI_WATCH_PATH=/en/video/${VIDEO}" >> $GITHUB_ENV
          echo "LHCI_CHANNEL_PATH=/en/channels/${CHANNEL}" >> $GITHUB_ENV
          echo "watch=$VIDEO channel=$CHANNEL"

      - name: Run Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.js
        env:
          LHCI_BASE_URL: ${{ env.WEB_APP_URL }}

      - name: Scan Lighthouse reports for secrets
        if: always()
        run: python3 scripts/ci/scan-artifacts-for-secrets.py --remove apps/web/.lighthouseci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 30
          include-hidden-files: true
