name: E2E Tests

# Legacy multi-browser suite against QA. Every run is real traffic on the QA
# workers (and Workers Logs lines), and a full matrix run takes ~1h40m, so:
#   - pull requests run the chromium project only (the release suite in
#     release-e2e.yml also runs on every PR into main);
#   - the full matrix (firefox, webkit, mobile, a11y, visual, Lighthouse) runs
#     nightly, after a Release run, and on demand (workflow_dispatch).
on:
  pull_request:
    branches: [main, 'integrate/**']
    paths-ignore:
      - '**.md'
      - 'docs/**'
  schedule:
    - cron: '30 2 * * *'
  workflow_run:
    workflows: [Release]
    types: [completed]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the visual snapshot baselines (Linux) and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  pull-requests: read  # the superseded check reads the PR's current head
  checks: write  # EnricoMi/publish-unit-test-result-action creates the JUnit check runs

# A newer push to a PR cancels that PR's older run (its accounts are its own and
# its teardown still runs); runs of different PRs, and of main, never cancel or
# replace each other.
concurrency:
  group: e2e-${{ github.head_ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  OPENAUTH_URL: https://auth.qa.alummahnow.net
  WEB_APP_URL: https://videos.qa.alummahnow.net
  API_URL: https://videos.api.qa.alummahnow.net
  OPENAUTH_CLIENT_ID: e0de3c30-0304-4ac4-86d6-1e185dec0439

jobs:
  # Every UI spec on every browser/device project. Each job registers its own
  # accounts (e2e+<run>-<attempt>-web-<project>-<role>@e2e.alummahnow.net,
  # apps/web/e2e/test-utils/run-users.ts) and deletes them when it ends (the
  # always() teardown steps below), so jobs of this run, other PRs' runs and
  # nightly runs never share users and need no queue. There is no job-level
  # concurrency group: GitHub kept only one pending job per group, so every
  # newly queued PR run cancelled the one waiting before it.
  #
  # The few specs that touch state no run owns (seed-video likes and comments,
  # the global site theme: playwright.config.ts SHARED_STATE_SPECS) run once per
  # run, in the chromium job, under the cross-run qa-global lock
  # (scripts/ci/qa-lock.ts), which waits its turn instead of replacing anyone.
  e2e:
    name: E2E - ${{ matrix.project }}
    # A PR labelled skip-qa-e2e (spec-only fixes while main's E2E is being made green) sends no
    # traffic to QA: those specs are proven by the verification run on main
    if: ${{ github.event_name != 'pull_request' || !contains(github.event.pull_request.labels.*.name, 'skip-qa-e2e') }}
    runs-on: ubuntu-24.04
    # specs (100) + shared-state (up to 85 waiting + 40) + teardown (15); the
    # teardown steps must always get their turn
    timeout-minutes: 250
    permissions:
      contents: write  # only the qa-lock steps get the token (a git ref is the lock)
      actions: read  # qa-lock: is the lock's holder run still going?
      packages: read
      pull-requests: read
      checks: write

    # Pull requests: chromium only. Everything else: the full matrix.
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(github.event_name == 'pull_request' && '[{"project":"chromium","slug":"chromium"}]' || '[{"project":"chromium","slug":"chromium"},{"project":"firefox","slug":"firefox"},{"project":"webkit","slug":"webkit"},{"project":"Mobile Chrome","slug":"mobile-chrome"},{"project":"Mobile Safari","slug":"mobile-safari"}]') }}

    env:
      # Run mode: this job's own accounts (auth.setup.ts, run-users.ts)
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PROJECT: ${{ matrix.slug }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          # The job token can write refs (the lock): keep it out of .git/config
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      # Every account this job generates is listed here before it is registered,
      # so the teardown deletes it even when the job is cancelled half-way
      - name: Run accounts file
        run: echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Install Playwright browsers
        # chromium is always needed (auth setup fallback); webkit serves Mobile Safari
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: ${{ matrix.project == 'firefox' && 'chromium firefox' || ((matrix.project == 'webkit' || matrix.project == 'Mobile Safari') && 'chromium webkit' || 'chromium') }}

      - name: Record E2E start
        id: e2e-start
        run: echo "at=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      # The PR-level concurrency group cancels a run once a newer push starts
      # one; this catches a run that started just before that push. Skip the
      # specs: the newer push's run tests the PR (and its uploads would only add
      # Bunny encodes to the library QA and stage share).
      - name: Superseded?
        id: superseded
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_SHA: ${{ github.event.pull_request.head.sha }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          head=$(gh api "repos/${{ github.repository }}/pulls/$PR" --jq .head.sha || echo "")
          if [ -n "$head" ] && [ "$head" != "$RUN_SHA" ]; then
            echo "::notice::PR #$PR moved on to ${head:0:8}; this run (${RUN_SHA:0:8}) skips its specs"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Uploads this job sends to QA (Bunny encodes in the library QA and stage
      # share): the pinned users' upload counters before and after the specs.
      - name: Upload budget (before)
        id: uploads-before
        if: steps.superseded.outputs.skip != 'true'
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/release/upload-budget.ts --env qa --emails "e2e+${{ github.run_id }}-${{ github.run_attempt }}-web-${{ matrix.slug }}-%@e2e.alummahnow.net" --snapshot "$RUNNER_TEMP/uploads-before.json"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Run E2E specs
        if: steps.superseded.outputs.skip != 'true'
        working-directory: apps/web
        run: pnpm exec playwright test --project="${{ matrix.project }}"
        env:
          CI: true
          # Pull requests: the upload transport/UI specs are covered by the release
          # suite on every PR; they run nightly and after every Release, in chromium
          # only (playwright.config.ts UPLOAD_SPECS)
          E2E_SKIP_UPLOAD_SPECS: ${{ github.event_name == 'pull_request' && '1' || '' }}
          E2E_GLOBAL_TIMEOUT_MINUTES: '100'
          E2E_MAX_FAILURES: '40'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # auth.setup has a promoted QA admin give the channel-owning users the Creator tier
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      # The global-state specs (SHARED_STATE_SPECS), once per run, one run at a
      # time across the repository: the qa-global lock waits for its turn (it is
      # never replaced or cancelled by another run). Same users, no new setup.
      - name: Acquire the qa-global lock
        id: lock
        if: steps.superseded.outputs.skip != 'true' && matrix.project == 'chromium' && !cancelled()
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts acquire qa-global --ttl-min 45 --max-wait-min 85

      - name: Run shared-state specs
        if: steps.lock.outputs.holder != '' && !cancelled()
        working-directory: apps/web
        timeout-minutes: 40
        run: pnpm exec playwright test --project=shared-state
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          E2E_OUTPUT_SUFFIX: shared-state
          E2E_GLOBAL_TIMEOUT_MINUTES: '35'
          E2E_MAX_FAILURES: '20'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      - name: Release the qa-global lock
        if: always() && steps.lock.outputs.holder != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts release qa-global --holder "${{ steps.lock.outputs.holder }}"

      # Load / performance / timing specs (tag @load, e.g. 07-performance): reported in the job
      # summary, never gating (owner rule 2026-11-12). Chromium only, not on PRs: nightly, after a
      # Release and by hand.
      - name: Load and timing specs (non-blocking)
        if: matrix.project == 'chromium' && github.event_name != 'pull_request' && steps.superseded.outputs.skip != 'true' && !cancelled()
        continue-on-error: true
        working-directory: apps/web
        timeout-minutes: 20
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          E2E_LOAD: only
          E2E_OUTPUT_SUFFIX: load
          E2E_GLOBAL_TIMEOUT_MINUTES: '15'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}
        run: |
          set +e
          pnpm exec playwright test --project=chromium --reporter=line > "$RUNNER_TEMP/load.txt" 2>&1
          code=$?
          tail -60 "$RUNNER_TEMP/load.txt"
          {
            echo "### Load and timing specs (non-blocking)"
            if [ "$code" = 0 ]; then echo "All @load specs passed."; else echo "Some @load specs failed (exit $code). They are reported here and do not gate this run."; fi
            echo '```'
            grep -E "^ +[0-9]+ (passed|failed|flaky|skipped)|^ +[0-9]+\) \[" "$RUNNER_TEMP/load.txt" | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$code"

      # Teardown, pass, fail or cancelled: everything the run accounts own goes
      # (videos with their Bunny media, then the GDPR erase of profile, channels,
      # playlists, history...), then the accounts themselves (auth soft delete +
      # immediate purge, QA-only route). Anything left by a killed runner is
      # removed by e2e-run-users-sweep.yml after 24 hours.
      - name: Erase the run accounts' content
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ ! -s "$E2E_RUN_USERS_FILE" ]; then echo "No run accounts were generated"; exit 0; fi
          pnpm exec tsx apps/web/e2e/cleanup-test-content.ts --run-users
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Delete the run accounts
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts
          --auth-url "$OPENAUTH_URL" --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      # Budget: a PR run sends ~9 uploads with bytes (+ record-only disposables);
      # chromium in the full matrix adds the upload specs. Over it: a warning.
      - name: Upload budget (QA)
        if: always() && steps.uploads-before.outcome == 'success'
        continue-on-error: true
        run: >-
          node --experimental-strip-types --no-warnings scripts/release/upload-budget.ts --env qa
          --emails "e2e+${{ github.run_id }}-${{ github.run_attempt }}-web-${{ matrix.slug }}-%@e2e.alummahnow.net" --baseline "$RUNNER_TEMP/uploads-before.json"
          --label "${{ matrix.project }}" --max ${{ github.event_name != 'pull_request' && matrix.project == 'chromium' && '90' || '45' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # QA videos-queue writes/min and DLQ writes during this run (all QA traffic in
      # the window, not only this job). Informational for now: it does not fail the job.
      - name: Queue budget (QA)
        if: always() && steps.e2e-start.outputs.at && steps.superseded.outputs.skip != 'true'
        continue-on-error: true
        run: node --experimental-strip-types --no-warnings scripts/release/queue-budget.ts --env qa --since "${{ steps.e2e-start.outputs.at }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Artifact name
        if: always()
        id: art
        shell: bash
        run: echo "name=$(echo '${{ matrix.project }}' | tr ' ' '-')" >> $GITHUB_OUTPUT

      # Artifacts of this public repo are downloadable by anyone signed in to
      # GitHub: drop any output that holds a secret or a storage state, then fail.
      - name: Scan test output for secrets
        if: always()
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # auth.setup has a promoted QA admin give the channel-owning users the Creator tier
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: >-
          python3 scripts/ci/scan-artifacts-for-secrets.py
          --env E2E_CODE_SINK_SECRET --env E2E_USER_PASSWORD --env TEST_PROMOTE_SECRET --env CLOUDFLARE_API_TOKEN
          --remove apps/web/playwright-report apps/web/test-results apps/web/playwright-report-shared-state apps/web/test-results-shared-state

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.art.outputs.name }}
          path: |
            apps/web/playwright-report/
            apps/web/playwright-report-shared-state/
          retention-days: 30

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.art.outputs.name }}
          path: |
            apps/web/test-results/
            apps/web/test-results-shared-state/
          retention-days: 14

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@da5b7be67623cd59bbbd1a0ce4f022050a55605f # v2
        with:
          files: |
            apps/web/test-results/junit.xml
            apps/web/test-results-shared-state/junit.xml
          check_name: E2E Results (${{ matrix.project }})
          comment_mode: off

  # axe-core WCAG 2.1 AA on every page, en/ar x light/dark (project "a11y")
  # and visual snapshots of key pages (project "visual").
  # Each job registers its own users in Playwright's global setup: storage
  # state (live QA session cookies) is never passed between jobs as an
  # artifact, since anyone signed in to GitHub can download artifacts here.
  #
  # Both read the global site theme, so the whole project runs under the
  # qa-global lock (nightly / after a Release only, never on pull requests).
  dedicated:
    name: E2E - ${{ matrix.project }}
    if: ${{ github.event_name != 'pull_request' && !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    permissions:
      contents: write  # only the qa-lock steps get the token
      actions: read
      packages: read
    env:
      E2E_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      E2E_PROJECT: ${{ matrix.project }}

    strategy:
      fail-fast: false
      matrix:
        project: [a11y, visual]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Run accounts file
        run: echo "E2E_RUN_USERS_FILE=$RUNNER_TEMP/run-users.txt" >> "$GITHUB_ENV"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: chromium

      - name: Acquire the qa-global lock
        id: lock
        timeout-minutes: 90
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts acquire qa-global --ttl-min 50 --max-wait-min 85

      - name: Run ${{ matrix.project }} project
        timeout-minutes: 45
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: true
          E2E_MAX_FAILURES: '0'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # auth.setup has a promoted QA admin give the channel-owning users the Creator tier
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      - name: Release the qa-global lock
        if: always() && steps.lock.outputs.holder != ''
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types --no-warnings scripts/ci/qa-lock.ts release qa-global --holder "${{ steps.lock.outputs.holder }}"

      - name: Erase the run accounts' content
        if: always()
        continue-on-error: true
        timeout-minutes: 10
        run: |
          if [ ! -s "$E2E_RUN_USERS_FILE" ]; then echo "No run accounts were generated"; exit 0; fi
          pnpm exec tsx apps/web/e2e/cleanup-test-content.ts --run-users
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}

      - name: Delete the run accounts
        if: always()
        continue-on-error: true
        timeout-minutes: 5
        run: >-
          node --experimental-strip-types --no-warnings scripts/e2e/teardown-run-users.ts
          --auth-url "$OPENAUTH_URL" --file "$E2E_RUN_USERS_FILE"
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      - name: Scan test output for secrets
        if: always()
        env:
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # auth.setup has a promoted QA admin give the channel-owning users the Creator tier
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}
        run: >-
          python3 scripts/ci/scan-artifacts-for-secrets.py
          --env E2E_CODE_SINK_SECRET --env E2E_USER_PASSWORD --env TEST_PROMOTE_SECRET
          --remove apps/web/playwright-report apps/web/test-results

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

  # workflow_dispatch with update_snapshots=true: regenerate the Linux
  # baselines in e2e/visual/__screenshots__ and commit them to the branch.
  update-visual-snapshots:
    name: Update visual snapshots
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@eae0cfeb286e66ffb5155f1a79b90583a127a68b # v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build
          pnpm --filter @al-ummah/theme-packages build

      - name: Install Playwright browsers
        uses: ./.github/actions/playwright-install
        with:
          working-directory: apps/web
          browsers: chromium

      - name: Regenerate snapshots
        working-directory: apps/web
        run: pnpm exec playwright test --project=visual --update-snapshots=all
        env:
          CI: true
          E2E_MAX_FAILURES: '0'
          E2E_CODE_SINK_SECRET: ${{ secrets.E2E_CODE_SINK_SECRET_QA }}
          E2E_USER_PASSWORD: ${{ secrets.E2E_USER_PASSWORD }}
          # auth.setup has a promoted QA admin give the channel-owning users the Creator tier
          TEST_PROMOTE_SECRET: ${{ secrets.TEST_PROMOTE_SECRET_QA }}

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
          else
            git commit -m "test(e2e): update visual snapshots (Linux)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  # Lighthouse CI budgets for home, watch, channel and search on QA.
  # Non-blocking for now: assertions are warnings and the job may fail.
  lighthouse:
    name: Lighthouse (QA)
    if: ${{ github.event_name != 'pull_request' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve QA seed URLs
        shell: bash
        run: |
          # The channel comes from the seed video: QA holds hundreds of E2E channels, and the seed
          # channel fell off the first page of /api/channels (Lighthouse then audited /en/channels/)
          SEED=$(curl -fsS "$API_URL/api/videos?limit=100" | jq -c '[.data[] | select(.title | startswith("QA Lecture"))][0] // {}')
          VIDEO=$(echo "$SEED" | jq -r '.id // empty')
          CHANNEL=$(echo "$SEED" | jq -r '.channelId // empty')
          if [ -z "$VIDEO" ] || [ -z "$CHANNEL" ]; then
            echo "::error::QA seed video or its channel not found (video='$VIDEO' channel='$CHANNEL')"
            exit 1
          fi
          echo "LHCI_WATCH_PATH=/en/video/${VIDEO}" >> $GITHUB_ENV
          echo "LHCI_CHANNEL_PATH=/en/channels/${CHANNEL}" >> $GITHUB_ENV
          echo "watch=$VIDEO channel=$CHANNEL"

      - name: Run Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.js
        env:
          LHCI_BASE_URL: ${{ env.WEB_APP_URL }}

      - name: Scan Lighthouse reports for secrets
        if: always()
        run: python3 scripts/ci/scan-artifacts-for-secrets.py --remove apps/web/.lighthouseci

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 30
          include-hidden-files: true
