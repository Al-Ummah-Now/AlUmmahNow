name: E2E Tests

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Regenerate the visual snapshot baselines (Linux) and commit them to this branch'
        type: boolean
        default: false

permissions:
  contents: read
  packages: read
  checks: write  # EnricoMi/publish-unit-test-result-action creates the JUnit check runs

env:
  OPENAUTH_URL: https://auth.qa.alummahnow.net
  WEB_APP_URL: https://videos.qa.alummahnow.net
  API_URL: https://videos.api.qa.alummahnow.net
  OPENAUTH_CLIENT_ID: e0de3c30-0304-4ac4-86d6-1e185dec0439

jobs:
  # Centralized auth setup - runs once, shares auth state with all test jobs
  auth-setup:
    name: Auth Setup
    runs-on: ubuntu-24.04  # Playwright 1.56 has no browser builds for ubuntu-latest (26.04)
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright (chromium only for auth)
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Create auth directory
        working-directory: apps/web
        run: mkdir -p e2e/.auth

      - name: Run auth setup
        working-directory: apps/web
        run: npx tsx e2e/run-auth-setup.ts
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: List auth files
        run: ls -la apps/web/e2e/.auth/

      - name: Upload auth state
        uses: actions/upload-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/
          retention-days: 1
          if-no-files-found: error
          include-hidden-files: true

  # Every UI spec on every browser/device project, sharded so each job stays
  # well under the Playwright globalTimeout.
  e2e:
    name: E2E - ${{ matrix.project }} (${{ matrix.shard }}/3)
    needs: auth-setup
    runs-on: ubuntu-24.04
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        project: [chromium, firefox, webkit, 'Mobile Chrome', 'Mobile Safari']
        shard: [1, 2, 3]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        # chromium is always needed (auth setup fallback); webkit serves Mobile Safari
        run: |
          case "${{ matrix.project }}" in
            firefox) B=firefox ;;
            webkit|'Mobile Safari') B=webkit ;;
            *) B= ;;
          esac
          pnpm exec playwright install --with-deps chromium $B

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Run E2E specs
        working-directory: apps/web
        run: pnpm exec playwright test --project="${{ matrix.project }}" --shard=${{ matrix.shard }}/3
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          E2E_MAX_FAILURES: '40'
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}

      - name: Artifact name
        if: always()
        id: art
        shell: bash
        run: echo "name=$(echo '${{ matrix.project }}' | tr ' ' '-')-${{ matrix.shard }}" >> $GITHUB_OUTPUT

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ steps.art.outputs.name }}
          path: apps/web/playwright-report/
          retention-days: 30

      - name: Upload traces, screenshots and videos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ steps.art.outputs.name }}
          path: apps/web/test-results/
          retention-days: 14

      - name: Publish JUnit results
        if: always()
        uses: EnricoMi/publish-unit-test-result-action@v2
        with:
          files: apps/web/test-results/junit.xml
          check_name: E2E Results (${{ matrix.project }} ${{ matrix.shard }}/3)
          comment_mode: off

  # axe-core WCAG 2.1 AA on every page, en/ar x light/dark (project "a11y")
  # and visual snapshots of key pages (project "visual").
  dedicated:
    name: E2E - ${{ matrix.project }}
    needs: auth-setup
    if: ${{ !inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        project: [a11y, visual]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Run ${{ matrix.project }} project
        working-directory: apps/web
        run: pnpm exec playwright test --project=${{ matrix.project }}
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          E2E_MAX_FAILURES: '0'

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30

  # workflow_dispatch with update_snapshots=true: regenerate the Linux
  # baselines in e2e/visual/__screenshots__ and commit them to the branch.
  update-visual-snapshots:
    name: Update visual snapshots
    needs: auth-setup
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: 9.15.4

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build shared packages
        run: |
          pnpm --filter @al-ummah/shared-types build
          pnpm --filter @al-ummah/logger build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: pnpm exec playwright install --with-deps chromium

      - name: Download auth state
        uses: actions/download-artifact@v4
        with:
          name: auth-state
          path: apps/web/e2e/.auth/

      - name: Regenerate snapshots
        working-directory: apps/web
        run: pnpm exec playwright test --project=visual --update-snapshots=all
        env:
          CI: true
          SKIP_AUTH_SETUP: 'true'
          E2E_MAX_FAILURES: '0'

      - name: Commit snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/web/e2e/visual/__screenshots__
          if git diff --cached --quiet; then
            echo "Snapshots unchanged"
          else
            git commit -m "test(e2e): update visual snapshots (Linux)"
            git pull --rebase origin "${GITHUB_REF_NAME}"
            git push
          fi

  # Lighthouse CI budgets for home, watch, channel and search on QA.
  # Non-blocking for now: assertions are warnings and the job may fail.
  lighthouse:
    name: Lighthouse (QA)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    continue-on-error: true

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Resolve QA seed URLs
        shell: bash
        run: |
          VIDEO=$(curl -fsS "$API_URL/api/videos?limit=100" | jq -r '[.data[] | select(.title | startswith("QA Lecture"))][0].id // empty')
          CHANNEL=$(curl -fsS "$API_URL/api/channels?limit=200" | jq -r '[.data[] | select(.name | startswith("Al Ummah Now QA"))][0].id // empty')
          echo "LHCI_WATCH_PATH=/en/video/${VIDEO}" >> $GITHUB_ENV
          echo "LHCI_CHANNEL_PATH=/en/channels/${CHANNEL}" >> $GITHUB_ENV
          echo "watch=$VIDEO channel=$CHANNEL"

      - name: Run Lighthouse CI
        working-directory: apps/web
        run: npx --yes @lhci/cli@0.14.0 autorun --config=./lighthouserc.js
        env:
          LHCI_BASE_URL: ${{ env.WEB_APP_URL }}

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-reports
          path: apps/web/.lighthouseci/
          retention-days: 30
          include-hidden-files: true
