name = "al-ummah-scheduler"
main = "src/index.ts"
compatibility_date = "2025-01-20"
compatibility_flags = ["nodejs_compat"]

# Run every minute
[[triggers.crons]]
cron = "* * * * *"

# R2 Buckets
[[r2_buckets]]
binding = "VIDEOS"
bucket_name = "al-ummah-now-videos"
preview_bucket_name = "al-ummah-now-videos-preview"

[[r2_buckets]]
binding = "SCHEDULED_VIDEOS"
bucket_name = "scheduled-videos"
preview_bucket_name = "scheduled-videos-preview"

# Queue for events
[[queues.producers]]
queue = "al-ummah-now-videos"
binding = "QUEUE"

# KV for distributed locks
[[kv_namespaces]]
binding = "SCHEDULER_LOCKS"
id = "scheduler-locks-kv"
preview_id = "scheduler-locks-kv-preview"

# KV for metrics
[[kv_namespaces]]
binding = "SCHEDULER_METRICS"
id = "scheduler-metrics-kv"
preview_id = "scheduler-metrics-kv-preview"

# Environment variables
[vars]
MAX_RETRIES = "3"
BATCH_SIZE = "50"
LOCK_TTL = "120"
WEBSOCKET_URL = "https://ws.alummahnow.net"

# Staging environment
[env.staging]
name = "al-ummah-scheduler-staging"
vars = { WEBSOCKET_URL = "https://ws-staging.alummahnow.net" }

[[env.staging.r2_buckets]]
binding = "VIDEOS"
bucket_name = "al-ummah-now-videos-staging"

[[env.staging.r2_buckets]]
binding = "SCHEDULED_VIDEOS"
bucket_name = "scheduled-videos-staging"

[[env.staging.queues.producers]]
queue = "al-ummah-now-videos-staging"
binding = "QUEUE"
