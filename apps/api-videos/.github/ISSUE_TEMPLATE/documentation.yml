name: 📚 Documentation Request
description: Request improvements or additions to documentation
title: "[DOCS] "
labels: ["documentation", "needs-review"]
projects: ["meywd/1"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for helping improve the Al-Ummah Now Videos API documentation!
        
        **Project Board**: [Al-Ummah Now Master Project](https://github.com/users/meywd/projects/1/views/1)
        
        **Current Documentation**:
        - [README.md](../README.md) - Setup and development info
        - [AUTHENTICATION.md](../AUTHENTICATION.md) - API authentication guide
        - [DEVELOPER_AUTH_GUIDE.md](../DEVELOPER_AUTH_GUIDE.md) - Developer authentication guide
        - [TECHNICAL_DOCUMENTATION.md](../TECHNICAL_DOCUMENTATION.md) - Architecture and API reference
        - [ROADMAP.md](../ROADMAP.md) - Feature roadmap and development phases
        - [OpenAPI Documentation](https://videos.api.alummahnow.net/) - Interactive API docs

  - type: dropdown
    id: doc-type
    attributes:
      label: Documentation Type
      description: What type of documentation are you requesting?
      options:
        - Update existing documentation
        - New documentation needed
        - Fix documentation error
        - Improve documentation clarity
        - Add missing examples
        - Translation/localization
        - API reference improvements
        - Tutorial or guide request
    validations:
      required: true

  - type: dropdown
    id: doc-category
    attributes:
      label: Documentation Category
      description: Which area of documentation does this relate to?
      options:
        - API Endpoints & Reference
        - Authentication & Security
        - Getting Started & Setup
        - Architecture & Technical Design
        - Code Examples & Tutorials
        - Error Handling & Troubleshooting
        - Deployment & Infrastructure
        - Developer Guides
        - Best Practices
        - Integration Guides
        - OpenAPI/Swagger Documentation
        - Contributing Guidelines
        - Roadmap & Planning
        - Other
    validations:
      required: true

  - type: input
    id: affected-files
    attributes:
      label: Affected Documentation Files
      description: Which files or sections need attention? (if known)
      placeholder: e.g., README.md, AUTHENTICATION.md, /api/videos endpoint docs

  - type: textarea
    id: current-issue
    attributes:
      label: Current Issue or Gap
      description: What's missing, incorrect, or unclear in the current documentation?
      placeholder: |
        Describe the issue:
        - What information is missing?
        - What's confusing or unclear?
        - What errors did you find?
        - What examples would be helpful?
    validations:
      required: true

  - type: textarea
    id: proposed-improvement
    attributes:
      label: Proposed Improvement
      description: How would you like to see this documentation improved?
      placeholder: |
        Describe your suggested improvement:
        - What specific information should be added?
        - How should it be organized?
        - What format would be most helpful?
        - What examples or code snippets would help?

  - type: dropdown
    id: target-audience
    attributes:
      label: Target Audience
      description: Who is the primary audience for this documentation?
      multiple: true
      options:
        - New developers getting started
        - Experienced API developers
        - Frontend developers
        - Backend developers
        - Mobile app developers
        - System administrators
        - Content creators/users
        - API maintainers/contributors
        - Business stakeholders

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this documentation improvement?
      options:
        - Low - Minor improvement
        - Medium - Would help many users
        - High - Blocking user adoption
        - Critical - Incorrect information causing issues
    validations:
      required: true

  - type: textarea
    id: context-scenario
    attributes:
      label: Use Case or Scenario
      description: Describe the specific use case or scenario where better documentation would help
      placeholder: |
        Provide context:
        - What were you trying to achieve?
        - What documentation did you expect to find?
        - How did the lack of documentation impact you?
        - What workflow or task would this improve?

  - type: textarea
    id: examples-references
    attributes:
      label: Examples or References
      description: Provide examples of good documentation or references that inspired this request
      placeholder: |
        Share examples or references:
        - Links to well-documented APIs you admire
        - Specific examples you'd like to see
        - Screenshots of confusing sections
        - Code snippets that would be helpful

  - type: checkboxes
    id: doc-format
    attributes:
      label: Preferred Documentation Format
      description: What format would be most helpful? (select all that apply)
      options:
        - label: Written documentation (Markdown)
        - label: Code examples with comments
        - label: Interactive examples in OpenAPI/Swagger
        - label: Tutorial/walkthrough format
        - label: Video or visual content
        - label: Diagrams or flowcharts
        - label: FAQ format
        - label: Quick reference/cheat sheet

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Any additional context, screenshots, or links that would be helpful
      placeholder: |
        Add any additional context:
        - Screenshots of confusing sections
        - Links to related discussions
        - External documentation you found helpful
        - Specific error messages you encountered

  - type: checkboxes
    id: contribution
    attributes:
      label: Contribution Interest
      description: Are you interested in helping with this documentation?
      options:
        - label: I'm willing to write the documentation
        - label: I can provide examples and content
        - label: I can review and provide feedback
        - label: I prefer to just track progress

  - type: checkboxes
    id: internal-checklist
    attributes:
      label: Internal Checklist (for maintainers)
      options:
        - label: Documentation scope and requirements defined
        - label: Target audience and format confirmed
        - label: Resource requirements estimated
        - label: Integration with existing docs planned
        - label: Review and approval process identified
        - label: Update deployment process confirmed